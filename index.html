<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpeedRun Hub</title>

<style>
:root {
  --green: #166347;
  --background: #f4f7f5;
  --border: #dce7df;
  --text: #183225;
  --muted: #64766a;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--background);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
}

header {
  padding: 24px 18px;
  background: white;
  border-bottom: 1px solid var(--border);
}

.header-content, main { max-width: 800px; margin: auto; }

.logo { color: var(--green); font-size: 26px; font-weight: 850; }

main { padding: 24px 16px 50px; }

nav {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 22px;
}

button, input, select { font: inherit; }

button {
  padding: 13px;
  border: 0;
  border-radius: 11px;
  background: var(--green);
  color: white;
  cursor: pointer;
  font-weight: 700;
}

nav button { background: #e6eee8; color: var(--green); }
nav button.active { background: var(--green); color: white; }

button:focus-visible, input:focus-visible, select:focus-visible {
  outline: 3px solid #85b698;
  outline-offset: 3px;
}

.card {
  padding: 22px;
  background: white;
  border: 1px solid var(--border);
  border-radius: 18px;
  margin-bottom: 20px;
}

h1 { margin: 0 0 20px; font-size: 25px; }
.wr { background: var(--green); color: white; }
.wr-title { font-size: 16px; font-weight: 800; }

.wr-time {
  margin: 12px 0;
  font-size: clamp(22px, 5vw, 36px);
  font-weight: 850;
  font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere;
}

.table-container { overflow-x: auto; }

table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
}

th {
  padding: 12px 8px;
  border-bottom: 1px solid var(--border);
  color: var(--muted);
  font-size: 12px;
}

td {
  padding: 18px 8px;
  border-bottom: 1px solid var(--border);
  font-size: 15px;
}

tbody tr:last-child td { border-bottom: 0; }
th:last-child, td:last-child { text-align: right; }

.player {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 130px;
}

.flag {
  width: 28px;
  height: 20px;
  object-fit: contain;
  flex-shrink: 0;
}

.time {
  white-space: nowrap;
  font-weight: 750;
  font-variant-numeric: tabular-nums;
}

.video-link {
  display: inline-block;
  margin-left: 10px;
  color: var(--green);
  text-decoration: none;
  font-size: 12px;
  font-weight: bold;
}

.video-link:hover { text-decoration: underline; }

form { display: grid; gap: 18px; }

label {
  display: grid;
  gap: 8px;
  color: var(--muted);
  font-size: 14px;
  font-weight: 650;
}

input, select {
  width: 100%;
  padding: 13px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: #fbfcfb;
  color: var(--text);
}

.time-fields {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
}

.time-fields input { padding: 12px 5px; text-align: center; }

.preview {
  padding: 15px;
  background: #edf5ef;
  border-radius: 10px;
  text-align: center;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}

.note, .empty { color: var(--muted); font-size: 13px; line-height: 1.6; }
.empty { padding: 20px; text-align: center; }
#notice { margin-top: 15px; }

[hidden] { display: none !important; }

@media (max-width: 480px) {
  .card { padding: 16px; }
  td { padding: 16px 4px; font-size: 13px; }
  nav button { font-size: 13px; }
  .table-container table th:nth-child(1),
  .table-container table td:nth-child(1) { display: none; } /* Ocultar juego en móvil si se ve muy apretado */
}
</style>
</head>

<body>
<header>
  <div class="header-content">
    <div class="logo">SpeedRun Hub</div>
  </div>
</header>

<main>
  <nav aria-label="Secciones">
    <button id="rankingButton" class="active" aria-pressed="true" type="button">
      Tabla de clasificación
    </button>

    <button id="submitButton" aria-pressed="false" type="button">
      Enviar el récord
    </button>
  </nav>

  <section id="rankingPanel">
    <article class="card wr">
      <div class="wr-title">WR 🌏</div>
      <div id="wrTime" class="wr-time">00h:00m:00s.000ms</div>
      <div id="wrPlayer">Sin récords registrados</div>
    </article>

    <article class="card">
      <h1>Tabla de clasificación</h1>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th scope="col">Juego</th>
              <th scope="col">Categoría</th>
              <th scope="col">Jugador</th>
              <th scope="col">Tiempo</th>
            </tr>
          </thead>
          <tbody id="rankingBody"></tbody>
        </table>
      </div>

      <p id="emptyRanking" class="empty">
        Todavía no hay récords enviados.
      </p>
    </article>
  </section>

  <section id="submitPanel" hidden>
    <article class="card">
      <h1>Enviar el récord</h1>

      <form id="recordForm">
        
        <!-- NUEVO: Nombre del Juego -->
        <label>
          Nombre del juego
          <input id="gameName" maxlength="50" placeholder="Ej: snake.io" required>
        </label>

        <!-- NUEVO: Categoría libre (no obligatoria, pero recomendada) -->
        <label>
          Categoría (opcional)
          <input id="category" maxlength="30" placeholder="Ej: Any%, Glitchless, Carrera...">
        </label>

        <label>
          Nombre del jugador
          <input id="playerName" maxlength="40" placeholder="Escribe tu nombre" required>
        </label>

        <label>
          País y bandera
          <select id="country" required></select>
        </label>

        <div>
          <p class="note">Tiempo (completa solo lo que necesites)</p>
          <div class="time-fields">
            <label>Horas <input id="hours" type="number" min="0" max="99" step="1" placeholder="00"></label>
            <label>Minutos <input id="minutes" type="number" min="0" max="59" step="1" placeholder="00"></label>
            <label>Segundos <input id="seconds" type="number" min="0" max="59" step="1" placeholder="00"></label>
            <label>Milisegundos <input id="milliseconds" type="number" min="0" max="999" step="1" placeholder="000"></label>
          </div>
        </div>

        <div id="timePreview" class="preview">00h:00m:00s.000ms</div>

        <label>
          Enlace de YouTube (opcional)
          <input id="youtubeLink" type="url" placeholder="https://www.youtube.com/watch?v=...">
        </label>

        <button type="submit">Guardar récord</button>
      </form>
    </article>
  </section>

  <p id="notice" role="status" aria-live="polite"></p>
</main>

<script>
"use strict";

const $ = id => document.getElementById(id);
const STORAGE_KEY = "speedrun-simple-records-v1";
let records = [];
let storageReady = true;

const countries = {
  AD: "Andorra", AE: "Emiratos Árabes Unidos", AF: "Afganistán", AG: "Antigua y Barbuda", AI: "Anguila", AL: "Albania", AM: "Armenia", AO: "Angola", AQ: "Antártida", AR: "Argentina", AS: "Samoa Americana", AT: "Austria", AU: "Australia", AW: "Aruba", AX: "Islas Åland", AZ: "Azerbaiyán",
  BA: "Bosnia y Herzegovina", BB: "Barbados", BD: "Bangladés", BE: "Bélgica", BF: "Burkina Faso", BG: "Bulgaria", BH: "Baréin", BI: "Burundi", BJ: "Benín", BL: "San Bartolomé", BM: "Bermudas", BN: "Brunéi", BO: "Bolivia", BQ: "Bonaire, San Eustaquio y Saba", BR: "Brasil", BS: "Bahamas", BT: "Bután", BV: "Isla Bouvet", BW: "Botsuana", BY: "Bielorrusia", BZ: "Belice",
  CA: "Canadá", CC: "Islas Cocos", CD: "República Democrática del Congo", CF: "República Centroafricana", CG: "República del Congo", CH: "Suiza", CI: "Costa de Marfil", CK: "Islas Cook", CL: "Chile", CM: "Camerún", CN: "China", CO: "Colombia", CR: "Costa Rica", CU: "Cuba", CV: "Cabo Verde", CW: "Curazao", CX: "Isla de Navidad", CY: "Chipre", CZ: "Chequia",
  DE: "Alemania", DJ: "Yibuti", DK: "Dinamarca", DM: "Dominica", DO: "República Dominicana", DZ: "Argelia",
  EC: "Ecuador", EE: "Estonia", EG: "Egipto", EH: "Sáhara Occidental", ER: "Eritrea", ES: "España", ET: "Etiopía",
  FI: "Finlandia", FJ: "Fiyi", FK: "Islas Malvinas", FM: "Micronesia", FO: "Islas Feroe", FR: "Francia",
  GA: "Gabón", GB: "Reino Unido", GD: "Granada", GE: "Georgia", GF: "Guayana Francesa", GG: "Guernsey", GH: "Ghana", GI: "Gibraltar", GL: "Groenlandia", GM: "Gambia", GN: "Guinea", GP: "Guadalupe", GQ: "Guinea Ecuatorial", GR: "Grecia", GS: "Islas Georgias del Sur y Sandwich del Sur", GT: "Guatemala", GU: "Guam", GW: "Guinea-Bisáu", GY: "Guyana",
  HK: "Hong Kong", HM: "Islas Heard y McDonald", HN: "Honduras", HR: "Croacia", HT: "Haití", HU: "Hungría",
  ID: "Indonesia", IE: "Irlanda", IL: "Israel", IM: "Isla de Man", IN: "India", IO: "Territorio Británico del Océano Índico", IQ: "Irak", IR: "Irán", IS: "Islandia", IT: "Italia",
  JE: "Jersey", JM: "Jamaica", JO: "Jordania", JP: "Japón",
  KE: "Kenia", KG: "Kirguistán", KH: "Camboya", KI: "Kiribati", KM: "Comoras", KN: "San Cristóbal y Nieves", KP: "Corea del Norte", KR: "Corea del Sur", KW: "Kuwait", KY: "Islas Caimán", KZ: "Kazajistán",
  LA: "Laos", LB: "Líbano", LC: "Santa Lucía", LI: "Liechtenstein", LK: "Sri Lanka", LR: "Liberia", LS: "Lesoto", LT: "Lituania", LU: "Luxemburgo", LV: "Letonia", LY: "Libia",
  MA: "Marruecos", MC: "Mónaco", MD: "Moldavia", ME: "Montenegro", MF: "San Martín (parte francesa)", MG: "Madagascar", MH: "Islas Marshall", MK: "Macedonia del Norte", ML: "Malí", MM: "Myanmar", MN: "Mongolia", MO: "Macao", MP: "Islas Marianas del Norte", MQ: "Martinica", MR: "Mauritania", MS: "Montserrat", MT: "Malta", MU: "Mauricio", MV: "Maldivas", MW: "Malaui", MX: "México", MY: "Malasia", MZ: "Mozambique",
  NA: "Namibia", NC: "Nueva Caledonia", NE: "Níger", NF: "Isla Norfolk", NG: "Nigeria", NI: "Nicaragua", NL: "Países Bajos", NO: "Noruega", NP: "Nepal", NR: "Nauru", NU: "Niue", NZ: "Nueva Zelanda",
  OM: "Omán",
  PA: "Panamá", PE: "Perú", PF: "Polinesia Francesa", PG: "Papúa Nueva Guinea", PH: "Filipinas", PK: "Pakistán", PL: "Polonia", PM: "San Pedro y Miquelón", PN: "Islas Pitcairn", PR: "Puerto Rico", PS: "Palestina", PT: "Portugal", PW: "Palaos", PY: "Paraguay",
  QA: "Catar",
  RE: "Reunión", RO: "Rumanía", RS: "Serbia", RU: "Rusia", RW: "Ruanda",
  SA: "Arabia Saudita", SB: "Islas Salomón", SC: "Seychelles", SD: "Sudán", SE: "Suecia", SG: "Singapur", SH: "Santa Elena, Ascensión y Tristán de Acuña", SI: "Eslovenia", SJ: "Svalbard y Jan Mayen", SK: "Eslovaquia", SL: "Sierra Leona", SM: "San Marino", SN: "Senegal", SO: "Somalia", SR: "Surinam", SS: "Sudán del Sur", ST: "Santo Tomé y Príncipe", SV: "El Salvador", SX: "San Martín (parte neerlandesa)", SY: "Siria", SZ: "Esuatini",
  TC: "Islas Turcas y Caicos", TD: "Chad", TF: "Tierras Australes Francesas", TG: "Togo", TH: "Tailandia", TJ: "Tayikistán", TK: "Tokelau", TL: "Timor Oriental", TM: "Turkmenistán", TN: "Túnez", TO: "Tonga", TR: "Turquía", TT: "Trinidad y Tobago", TV: "Tuvalu", TW: "Taiwán", TZ: "Tanzania",
  UA: "Ucrania", UG: "Uganda", UM: "Islas menores alejadas de Estados Unidos", US: "Estados Unidos", UY: "Uruguay", UZ: "Uzbekistán",
  VA: "Ciudad del Vaticano", VC: "San Vicente y las Granadinas", VE: "Venezuela", VG: "Islas Vírgenes Británicas", VI: "Islas Vírgenes de Estados Unidos", VN: "Vietnam", VU: "Vanuatu",
  WF: "Wallis y Futuna", WS: "Samoa",
  YE: "Yemen", YT: "Mayotte",
  ZA: "Sudáfrica", ZM: "Zambia", ZW: "Zimbabue"
};

function flagEmoji(code) {
  return [...code].map(letter =>
    String.fromCodePoint(127397 + letter.charCodeAt(0))
  ).join("");
}

$("country").add(new Option("Selecciona tu país", ""));
Object.entries(countries)
  .sort((a, b) => a[1].localeCompare(b[1], "es"))
  .forEach(([code, name]) => {
    $("country").add(new Option(`${flagEmoji(code)} ${name}`, code));
  });

function validRecord(record) {
  return record &&
    typeof record.gameName === "string" &&
    typeof record.category === "string" &&
    typeof record.name === "string" &&
    Object.hasOwn(countries, record.country) &&
    Number.isSafeInteger(record.ms) &&
    record.ms > 0 &&
    record.ms < 360000000 &&
    Number.isFinite(record.created) &&
    (record.youtube === undefined || typeof record.youtube === "string");
}

try {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved !== null) {
    const parsed = JSON.parse(saved);
    if (!Array.isArray(parsed) || !parsed.every(validRecord)) {
      throw new Error("Datos inválidos");
    }
    records = parsed;
  }
} catch {
  storageReady = false;
  $("notice").textContent = "No se pudieron leer los datos guardados. No se sobrescribirán con registros nuevos.";
}

function formatTime(ms) {
  const hours = Math.floor(ms / 3600000);
  const minutes = Math.floor(ms / 60000) % 60;
  const seconds = Math.floor(ms / 1000) % 60;
  const milliseconds = ms % 1000;
  return (
    String(hours).padStart(2, "0") + "h:" +
    String(minutes).padStart(2, "0") + "m:" +
    String(seconds).padStart(2, "0") + "s." +
    String(milliseconds).padStart(3, "0") + "ms"
  );
}

function readTime() {
  const h = $("hours").value.trim() === "" ? 0 : Number($("hours").value);
  const m = $("minutes").value.trim() === "" ? 0 : Number($("minutes").value);
  const s = $("seconds").value.trim() === "" ? 0 : Number($("seconds").value);
  const ms = $("milliseconds").value.trim() === "" ? 0 : Number($("milliseconds").value);

  if (![h, m, s, ms].every(Number.isInteger)) return null;
  if (h < 0 || h > 99 || m < 0 || m > 59 || s < 0 || s > 59 || ms < 0 || ms > 999) return null;

  return h * 3600000 + m * 60000 + s * 1000 + ms;
}

function makePlayer(record) {
  const container = document.createElement("div");
  container.className = "player";
  const image = document.createElement("img");
  image.className = "flag";
  image.src = "https://flagcdn.com/w40/" + record.country.toLowerCase() + ".png";
  image.alt = countries[record.country];
  image.width = 28;
  image.height = 20;
  image.addEventListener("error", () => {
    const fallback = document.createElement("span");
    fallback.textContent = flagEmoji(record.country);
    fallback.setAttribute("aria-label", countries[record.country]);
    image.replaceWith(fallback);
  }, { once: true });
  const name = document.createElement("span");
  name.textContent = record.name;
  container.append(image, name);
  return container;
}

function render() {
  // Ordenar por juego, luego por categoría, luego por tiempo
  const sorted = [...records].sort((a, b) => {
    if (a.gameName !== b.gameName) return a.gameName.localeCompare(b.gameName);
    if (a.category !== b.category) return a.category.localeCompare(b.category);
    return a.ms - b.ms || a.created - b.created;
  });

  $("rankingBody").replaceChildren();

  for (const record of sorted) {
    const row = document.createElement("tr");
    
    const gameCell = document.createElement("td");
    gameCell.textContent = record.gameName;
    
    const catCell = document.createElement("td");
    catCell.textContent = record.category || "-";

    const playerCell = document.createElement("td");
    playerCell.append(makePlayer(record));
    
    const timeCell = document.createElement("td");
    timeCell.className = "time";
    timeCell.textContent = formatTime(record.ms);

    if (record.youtube && record.youtube.trim() !== "") {
      const ytLink = document.createElement("a");
      ytLink.href = record.youtube;
      ytLink.target = "_blank";
      ytLink.rel = "noopener noreferrer";
      ytLink.textContent = "▶ Video";
      ytLink.className = "video-link";
      timeCell.append(ytLink);
    }

    row.append(gameCell, catCell, playerCell, timeCell);
    $("rankingBody").append(row);
  }

  $("emptyRanking").hidden = sorted.length > 0;
  
  // El WR ahora es el mejor tiempo general (puedes cambiarlo para que sea por juego si quieres)
  const best = [...records].sort((a, b) => a.ms - b.ms)[0];
  $("wrTime").textContent = best ? formatTime(best.ms) : "00h:00m:00s.000ms";
  
  $("wrPlayer").replaceChildren();
  if (!best) {
    $("wrPlayer").textContent = "Sin récords registrados";
    return;
  }
  $("wrPlayer").append(makePlayer(best));
}

function showSubmission(show) {
  $("rankingPanel").hidden = show;
  $("submitPanel").hidden = !show;
  $("rankingButton").classList.toggle("active", !show);
  $("submitButton").classList.toggle("active", show);
  $("rankingButton").setAttribute("aria-pressed", String(!show));
  $("submitButton").setAttribute("aria-pressed", String(show));
}

$("rankingButton").onclick = () => showSubmission(false);
$("submitButton").onclick = () => showSubmission(true);

["hours", "minutes", "seconds", "milliseconds"].forEach(id => {
  $(id).addEventListener("input", () => {
    const time = readTime();
    $("timePreview").textContent = time === null ? "Completa el tiempo" : formatTime(time);
  });
});

$("recordForm").addEventListener("submit", event => {
  event.preventDefault();

  if (!storageReady) {
    $("notice").textContent = "No se puede guardar hasta resolver la lectura de los datos existentes.";
    return;
  }

  const gameName = $("gameName").value.trim();
  // Si no ponen categoría, ponemos "General" por defecto
  const category = $("category").value.trim() || "General"; 
  const name = $("playerName").value.trim();
  const country = $("country").value;
  const ms = readTime();
  const youtube = $("youtubeLink").value.trim();

  if (!gameName) {
    $("notice").textContent = "El nombre del juego es obligatorio.";
    return;
  }

  if (!name || !Object.hasOwn(countries, country)) {
    $("notice").textContent = "Completa el nombre y selecciona el país.";
    return;
  }

  if (ms === null || ms <= 0) {
    $("notice").textContent = "El tiempo es obligatorio y debe ser mayor que cero.";
    return;
  }

  if (youtube) {
    let url;
    try { url = new URL(youtube); } catch {
      $("notice").textContent = "Escribe un enlace completo de YouTube que empiece con https://.";
      return;
    }
    const host = url.hostname.toLowerCase();
    const allowedHosts = ["youtube.com", "www.youtube.com", "m.youtube.com", "youtu.be", "www.youtu.be"];
    const isShortLink = (host === "youtu.be" || host === "www.youtu.be") && /^\/[A-Za-z0-9_-]{11}\/?$/.test(url.pathname);
    const isWatchLink = host !== "youtu.be" && host !== "www.youtu.be" && url.pathname === "/watch" && /^[A-Za-z0-9_-]{11}$/.test(url.searchParams.get("v") || "");
    const isVideoPath = host !== "youtu.be" && host !== "www.youtu.be" && /^\/(shorts|live|embed)\/[A-Za-z0-9_-]{11}\/?$/.test(url.pathname);

    if (url.protocol !== "https:" || !allowedHosts.includes(host) || url.username || url.password || url.port || !(isShortLink || isWatchLink || isVideoPath)) {
      $("notice").textContent = "Introduce un enlace válido a un video de YouTube.";
      return;
    }
  }

  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    const latest = raw === null ? [] : JSON.parse(raw);

    if (!Array.isArray(latest) || !latest.every(validRecord)) {
      throw new Error("Datos guardados inválidos");
    }

    const updated = [
      ...latest,
      { gameName, category, name, country, ms, youtube, created: Date.now() }
    ];

    localStorage.setItem(STORAGE_KEY, JSON.stringify(updated));
    records = updated;
  } catch {
    $("notice").textContent = "No se pudo guardar el récord. Tus campos siguen completos para intentarlo otra vez.";
    return;
  }

  render();
  $("recordForm").reset();
  $("timePreview").textContent = "00h:00m:00s.000ms";
  showSubmission(false);
  $("notice").textContent = "Récord guardado correctamente.";
});

window.addEventListener("storage", event => {
  if (event.key !== STORAGE_KEY) return;
  try {
    const updated = JSON.parse(event.newValue || "[]");
    if (!Array.isArray(updated) || !updated.every(validRecord)) return;
    records = updated;
    render();
  } catch {
    $("notice").textContent = "No se pudo actualizar la lista desde la otra pestaña.";
  }
});

render();
</script>
</body>
</html>
