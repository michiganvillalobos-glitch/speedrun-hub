<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpeedRun Hub</title>

<style>
:root {
  --green: #166347;
  --background: #f4f7f5;
  --border: #dce7df;
  --text: #183225;
  --muted: #64766a;
  --red: #d32f2f;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--background);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
}

header {
  padding: 24px 18px;
  background: white;
  border-bottom: 1px solid var(--border);
}

.header-content {
  max-width: 800px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo { color: var(--green); font-size: 26px; font-weight: 850; }

#adminBtn {
  background: none;
  border: none;
  font-size: 24px;
  cursor: pointer;
  color: var(--muted);
  padding: 5px;
}
#adminBtn.active { color: var(--red); }

main { max-width: 800px; margin: auto; padding: 24px 16px 50px; }

nav {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 22px;
}

button, input, select { font: inherit; }

button {
  padding: 13px;
  border: 0;
  border-radius: 11px;
  background: var(--green);
  color: white;
  cursor: pointer;
  font-weight: 700;
}

nav button { background: #e6eee8; color: var(--green); }
nav button.active { background: var(--green); color: white; }

.card {
  padding: 22px;
  background: white;
  border: 1px solid var(--border);
  border-radius: 18px;
  margin-bottom: 20px;
}

h1 { margin: 0 0 20px; font-size: 25px; }
.wr { background: var(--green); color: white; }
.wr-title { font-size: 16px; font-weight: 800; }

.wr-time {
  margin: 12px 0;
  font-size: clamp(22px, 5vw, 36px);
  font-weight: 850;
  font-variant-numeric: tabular-nums;
}

.search-box {
  width: 100%;
  padding: 12px 15px;
  margin-bottom: 20px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: #fbfcfb;
}

.game-group {
  margin-bottom: 30px;
  border-left: 4px solid var(--green);
  padding-left: 15px;
}

.game-title {
  font-size: 22px;
  font-weight: 800;
  margin: 0 0 15px 0;
}

.category-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--green);
  text-transform: uppercase;
  margin: 15px 0 8px 0;
  background: #edf5ef;
  display: inline-block;
  padding: 4px 10px;
  border-radius: 6px;
}

.table-container { overflow-x: auto; }

table { width: 100%; border-collapse: collapse; text-align: left; }

th {
  padding: 10px 8px;
  border-bottom: 1px solid var(--border);
  color: var(--muted);
  font-size: 12px;
}

td {
  padding: 15px 8px;
  border-bottom: 1px solid var(--border);
  font-size: 15px;
}

th:last-child, td:last-child { text-align: right; }

.player { display: flex; align-items: center; gap: 9px; }

.flag { width: 28px; height: 20px; object-fit: contain; }

.time { white-space: nowrap; font-weight: 750; }

.video-link {
  display: inline-block;
  margin-left: 10px;
  color: var(--green);
  text-decoration: none;
  font-size: 12px;
}

.admin-actions { display: inline-flex; gap: 5px; margin-left: 15px; }

.admin-btn-icon {
  background: none;
  border: 1px solid var(--border);
  padding: 4px 8px;
  border-radius: 6px;
  cursor: pointer;
}
.admin-btn-icon.delete { color: var(--red); background: #ffebee; }
.admin-btn-icon.edit { color: #1976d2; background: #e3f2fd; }

form { display: grid; gap: 18px; }

label { display: grid; gap: 8px; color: var(--muted); font-size: 14px; }

input, select {
  width: 100%;
  padding: 13px;
  border: 1px solid var(--border);
  border-radius: 10px;
}

.time-fields {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
}

.preview {
  padding: 15px;
  background: #edf5ef;
  border-radius: 10px;
  text-align: center;
  font-weight: 800;
}

.note, .empty { color: var(--muted); font-size: 13px; }
#notice { margin-top: 15px; font-weight: bold; }

[hidden] { display: none !important; }

@media (max-width: 480px) {
  .card { padding: 16px; }
  td { padding: 16px 4px; font-size: 13px; }
  .admin-actions { display: flex; margin-top: 5px; margin-left: 0; }
}
</style>
</head>

<body>
<header>
  <div class="header-content">
    <div class="logo">SpeedRun Hub</div>
    <button id="adminBtn" title="Panel de Moderador">⚙️</button>
  </div>
</header>

<main>
  <nav aria-label="Secciones">
    <button id="rankingButton" class="active" type="button">Tabla de clasificación</button>
    <button id="submitButton" type="button">Enviar el récord</button>
  </nav>

  <section id="rankingPanel">
    <article class="card wr">
      <div class="wr-title">WR 🌏</div>
      <div id="wrTime" class="wr-time">00h:00m:00s.000ms</div>
      <div id="wrPlayer">Sin récords registrados</div>
    </article>

    <article class="card">
      <h1>Tabla de clasificación</h1>
      <input type="text" id="searchGame" class="search-box" placeholder="🔍 Buscar juego...">
      <div id="rankingContainer"></div>
      <p id="emptyRanking" class="empty">Todavía no hay récords enviados.</p>
    </article>
  </section>

  <section id="submitPanel" hidden>
    <article class="card">
      <h1 id="formTitle">Enviar el récord</h1>
      <form id="recordForm">
        <input type="hidden" id="editRecordId">
        <label>Nombre del juego <input id="gameName" maxlength="50" value="snake.io" required></label>
        <label>Categoría (opcional) <input id="category" maxlength="30" placeholder="Ej: Any%"></label>
        <label>Nombre del jugador <input id="playerName" maxlength="40" required></label>
        <label>País y bandera <select id="country" required></select></label>
        
        <div>
          <p class="note">Tiempo</p>
          <div class="time-fields">
            <label>Horas <input id="hours" type="number" min="0" max="99"></label>
            <label>Minutos <input id="minutes" type="number" min="0" max="59"></label>
            <label>Segundos <input id="seconds" type="number" min="0" max="59"></label>
            <label>Milisegundos <input id="milliseconds" type="number" min="0" max="999"></label>
          </div>
        </div>

        <div id="timePreview" class="preview">00h:00m:00s.000ms</div>
        <label>Enlace de YouTube (opcional) <input id="youtubeLink" type="url"></label>
        
        <button type="submit" id="submitBtn">Guardar récord</button>
        <button type="button" id="cancelEditBtn" style="background: var(--muted); display: none;">Cancelar Edición</button>
      </form>
    </article>
  </section>
  <p id="notice" role="status"></p>
</main>
<script>
"use strict";

const ADMIN_PASSWORD = "admin123"; 
const $ = id => document.getElementById(id);
const STORAGE_KEY = "speedrun-hub-v5"; 
let records = [];
let isAdmin = false; 
let editingId = null;

const countries = {
  AD: "Andorra", AE: "Emiratos Árabes Unidos", AF: "Afganistán", AG: "Antigua y Barbuda", AI: "Anguila", AL: "Albania", AM: "Armenia", AO: "Angola", AQ: "Antártida", AR: "Argentina", AS: "Samoa Americana", AT: "Austria", AU: "Australia", AW: "Aruba", AX: "Islas Åland", AZ: "Azerbaiyán",
  BA: "Bosnia y Herzegovina", BB: "Barbados", BD: "Bangladés", BE: "Bélgica", BF: "Burkina Faso", BG: "Bulgaria", BH: "Baréin", BI: "Burundi", BJ: "Benín", BL: "San Bartolomé", BM: "Bermudas", BN: "Brunéi", BO: "Bolivia", BQ: "Bonaire, San Eustaquio y Saba", BR: "Brasil", BS: "Bahamas", BT: "Bután", BV: "Isla Bouvet", BW: "Botsuana", BY: "Bielorrusia", BZ: "Belice",
  CA: "Canadá", CC: "Islas Cocos", CD: "República Democrática del Congo", CF: "República Centroafricana", CG: "República del Congo", CH: "Suiza", CI: "Costa de Marfil", CK: "Islas Cook", CL: "Chile", CM: "Camerún", CN: "China", CO: "Colombia", CR: "Costa Rica", CU: "Cuba", CV: "Cabo Verde", CW: "Curazao", CX: "Isla de Navidad", CY: "Chipre", CZ: "Chequia",
  DE: "Alemania", DJ: "Yibuti", DK: "Dinamarca", DM: "Dominica", DO: "República Dominicana", DZ: "Argelia",
  EC: "Ecuador", EE: "Estonia", EG: "Egipto", EH: "Sáhara Occidental", ER: "Eritrea", ES: "España", ET: "Etiopía",
  FI: "Finlandia", FJ: "Fiyi", FK: "Islas Malvinas", FM: "Micronesia", FO: "Islas Feroe", FR: "Francia",
  GA: "Gabón", GB: "Reino Unido", GD: "Granada", GE: "Georgia", GF: "Guayana Francesa", GG: "Guernsey", GH: "Ghana", GI: "Gibraltar", GL: "Groenlandia", GM: "Gambia", GN: "Guinea", GP: "Guadalupe", GQ: "Guinea Ecuatorial", GR: "Grecia", GS: "Islas Georgias del Sur y Sandwich del Sur", GT: "Guatemala", GU: "Guam", GW: "Guinea-Bisáu", GY: "Guyana",
  HK: "Hong Kong", HM: "Islas Heard y McDonald", HN: "Honduras", HR: "Croacia", HT: "Haití", HU: "Hungría",
  ID: "Indonesia", IE: "Irlanda", IL: "Israel", IM: "Isla de Man", IN: "India", IO: "Territorio Británico del Océano Índico", IQ: "Irak", IR: "Irán", IS: "Islandia", IT: "Italia",
  JE: "Jersey", JM: "Jamaica", JO: "Jordania", JP: "Japón",
  KE: "Kenia", KG: "Kirguistán", KH: "Camboya", KI: "Kiribati", KM: "Comoras", KN: "San Cristóbal y Nieves", KP: "Corea del Norte", KR: "Corea del Sur", KW: "Kuwait", KY: "Islas Caimán", KZ: "Kazajistán",
  LA: "Laos", LB: "Líbano", LC: "Santa Lucía", LI: "Liechtenstein", LK: "Sri Lanka", LR: "Liberia", LS: "Lesoto", LT: "Lituania", LU: "Luxemburgo", LV: "Letonia", LY: "Libia",
  MA: "Marruecos", MC: "Mónaco", MD: "Moldavia", ME: "Montenegro", MF: "San Martín (parte francesa)", MG: "Madagascar", MH: "Islas Marshall", MK: "Macedonia del Norte", ML: "Malí", MM: "Myanmar", MN: "Mongolia", MO: "Macao", MP: "Islas Marianas del Norte", MQ: "Martinica", MR: "Mauritania", MS: "Montserrat", MT: "Malta", MU: "Mauricio", MV: "Maldivas", MW: "Malaui", MX: "México", MY: "Malasia", MZ: "Mozambique",
  NA: "Namibia", NC: "Nueva Caledonia", NE: "Níger", NF: "Isla Norfolk", NG: "Nigeria", NI: "Nicaragua", NL: "Países Bajos", NO: "Noruega", NP: "Nepal", NR: "Nauru", NU: "Niue", NZ: "Nueva Zelanda",
  OM: "Omán",
  PA: "Panamá", PE: "Perú", PF: "Polinesia Francesa", PG: "Papúa Nueva Guinea", PH: "Filipinas", PK: "Pakistán", PL: "Polonia", PM: "San Pedro y Miquelón", PN: "Islas Pitcairn", PR: "Puerto Rico", PS: "Palestina", PT: "Portugal", PW: "Palaos", PY: "Paraguay",
  QA: "Catar",
  RE: "Reunión", RO: "Rumanía", RS: "Serbia", RU: "Rusia", RW: "Ruanda",
  SA: "Arabia Saudita", SB: "Islas Salomón", SC: "Seychelles", SD: "Sudán", SE: "Suecia", SG: "Singapur", SH: "Santa Elena, Ascensión y Tristán de Acuña", SI: "Eslovenia", SJ: "Svalbard y Jan Mayen", SK: "Eslovaquia", SL: "Sierra Leona", SM: "San Marino", SN: "Senegal", SO: "Somalia", SR: "Surinam", SS: "Sudán del Sur", ST: "Santo Tomé y Príncipe", SV: "El Salvador", SX: "San Martín (parte neerlandesa)", SY: "Siria", SZ: "Esuatini",
  TC: "Islas Turcas y Caicos", TD: "Chad", TF: "Tierras Australes Francesas", TG: "Togo", TH: "Tailandia", TJ: "Tayikistán", TK: "Tokelau", TL: "Timor Oriental", TM: "Turkmenistán", TN: "Túnez", TO: "Tonga", TR: "Turquía", TT: "Trinidad y Tobago", TV: "Tuvalu", TW: "Taiwán", TZ: "Tanzania",
  UA: "Ucrania", UG: "Uganda", UM: "Islas menores alejadas de Estados Unidos", US: "Estados Unidos", UY: "Uruguay", UZ: "Uzbekistán",
  VA: "Ciudad del Vaticano", VC: "San Vicente y las Granadinas", VE: "Venezuela", VG: "Islas Vírgenes Británicas", VI: "Islas Vírgenes de Estados Unidos", VN: "Vietnam", VU: "Vanuatu",
  WF: "Wallis y Futuna", WS: "Samoa",
  YE: "Yemen", YT: "Mayotte",
  ZA: "Sudáfrica", ZM: "Zambia", ZW: "Zimbabue"
};

function flagEmoji(code) {
  return [...code].map(letter => String.fromCodePoint(127397 + letter.charCodeAt(0))).join("");
}

$("country").add(new Option("Selecciona tu país", ""));
Object.entries(countries).sort((a, b) => a[1].localeCompare(b[1], "es")).forEach(([code, name]) => {
  $("country").add(new Option(`${flagEmoji(code)} ${name}`, code));
});

try {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved !== null) records = JSON.parse(saved);
} catch { records = []; }

function formatTime(ms) {
  const hours = Math.floor(ms / 3600000);
  const minutes = Math.floor(ms / 60000) % 60;
  const seconds = Math.floor(ms / 1000) % 60;
  const milliseconds = ms % 1000;
  return (String(hours).padStart(2, "0") + "h:" + String(minutes).padStart(2, "0") + "m:" + String(seconds).padStart(2, "0") + "s." + String(milliseconds).padStart(3, "0") + "ms");
}

function readTime() {
  const h = $("hours").value.trim() === "" ? 0 : Number($("hours").value);
  const m = $("minutes").value.trim() === "" ? 0 : Number($("minutes").value);
  const s = $("seconds").value.trim() === "" ? 0 : Number($("seconds").value);
  const ms = $("milliseconds").value.trim() === "" ? 0 : Number($("milliseconds").value);
  if (![h, m, s, ms].every(Number.isInteger)) return null;
  if (h < 0 || h > 99 || m < 0 || m > 59 || s < 0 || s > 59 || ms < 0 || ms > 999) return null;
  return h * 3600000 + m * 60000 + s * 1000 + ms;
}

function makePlayer(record) {
  const container = document.createElement("div");
  container.className = "player";
  const image = document.createElement("img");
  image.className = "flag";
  image.src = "https://flagcdn.com/w40/" + record.country.toLowerCase() + ".png";
  image.alt = countries[record.country];
  image.width = 28; image.height = 20;
  image.addEventListener("error", () => {
    const fallback = document.createElement("span");
    fallback.textContent = flagEmoji(record.country);
    image.replaceWith(fallback);
  }, { once: true });
  const name = document.createElement("span");
  name.textContent = record.name;
  container.append(image, name);
  return container;
}

$("adminBtn").onclick = () => {
  if (isAdmin) {
    isAdmin = false;
    $("adminBtn").classList.remove("active");
    $("notice").textContent = "Modo moderador desactivado.";
    render();
  } else {
    const pass = prompt("Introduce la contraseña de moderador:");
    if (pass === ADMIN_PASSWORD) {
      isAdmin = true;
      $("adminBtn").classList.add("active");
      $("notice").textContent = "¡Modo moderador activado!";
      render();
    } else if (pass !== null) { alert("Contraseña incorrecta."); }
  }
};

function deleteRecord(id) {
  if (!isAdmin) return;
  if (confirm("¿Estás seguro de que quieres eliminar este récord?")) {
    records = records.filter(r => r.created !== id);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    render();
  }
}

function editRecord(id) {
  if (!isAdmin) return;
  const record = records.find(r => r.created === id);
  if (!record) return;

  $("gameName").value = record.game;
  $("category").value = record.category;
  $("playerName").value = record.name;
  $("country").value = record.country;
  $("youtubeLink").value = record.youtube || "";
  $("hours").value = Math.floor(record.ms / 3600000);
  $("minutes").value = Math.floor(record.ms / 60000) % 60;
  $("seconds").value = Math.floor(record.ms / 1000) % 60;
  $("milliseconds").value = record.ms % 1000;
  $("timePreview").textContent = formatTime(record.ms);

  editingId = id;
  $("editRecordId").value = id;
  $("submitBtn").textContent = "Actualizar récord";
  $("cancelEditBtn").style.display = "block";
  $("formTitle").textContent = "Editar récord";
  showSubmission(true);
}

$("cancelEditBtn").onclick = () => {
  editingId = null;
  $("recordForm").reset();
  $("editRecordId").value = "";
  $("submitBtn").textContent = "Guardar récord";
  $("cancelEditBtn").style.display = "none";
  $("formTitle").textContent = "Enviar el récord";
  $("timePreview").textContent = "00h:00m:00s.000ms";
  showSubmission(false);
};

function render() {
  const container = $("rankingContainer");
  container.replaceChildren();
  const searchTerm = $("searchGame").value.toLowerCase();
  const filtered = records.filter(r => r.game.toLowerCase().includes(searchTerm));

  $("emptyRanking").hidden = filtered.length > 0;
  if (filtered.length === 0) return;

  const grouped = {};
  for (const record of filtered) {
    if (!grouped[record.game]) grouped[record.game] = {};
    if (!grouped[record.game][record.category]) grouped[record.game][record.category] = [];
    grouped[record.game][record.category].push(record);
  }

  const sortedGames = Object.keys(grouped).sort((a,b) => a.localeCompare(b));

  for (const game of sortedGames) {
    const gameGroup = document.createElement("div");
    gameGroup.className = "game-group";
    const gameTitle = document.createElement("h2");
    gameTitle.className = "game-title";
    gameTitle.textContent = game;
    gameGroup.append(gameTitle);

    const sortedCategories = Object.keys(grouped[game]).sort((a,b) => a.localeCompare(b));

    for (const category of sortedCategories) {
      const catTitle = document.createElement("div");
      catTitle.className = "category-title";
      catTitle.textContent = category;
      gameGroup.append(catTitle);

      const tableContainer = document.createElement("div");
      tableContainer.className = "table-container";
      const table = document.createElement("table");
      const thead = document.createElement("thead");
      thead.innerHTML = `<tr><th scope="col">Jugador</th><th scope="col">Tiempo</th></tr>`;
      const tbody = document.createElement("tbody");

      const catRecords = grouped[game][category].sort((a, b) => a.ms - b.ms || a.created - b.created);
      const bestTime = catRecords[0].ms;
  let rank = 1;
      for (const record of catRecords) {
        const row = document.createElement("tr");
        const playerCell = document.createElement("td");
     playerCell.insertAdjacentText("afterbegin", `#${rank} `); 
      const timeCell = document.createElement("td");
    playerCell.append(makePlayer(record));
        timeCell.className = "time";
        
        if (record.ms === bestTime) {
          timeCell.textContent = "👑 " + formatTime(record.ms);
        } else {
          timeCell.textContent = formatTime(record.ms);
        }

        if (record.youtube && record.youtube.trim() !== "") {
          const ytLink = document.createElement("a");
          ytLink.href = record.youtube;
          ytLink.target = "_blank";
          ytLink.textContent = "▶ Video";
          ytLink.className = "video-link";
          timeCell.append(ytLink);
        }

        if (isAdmin) {
          const adminDiv = document.createElement("div");
          adminDiv.className = "admin-actions";
          const editBtn = document.createElement("button");
          editBtn.className = "admin-btn-icon edit";
          editBtn.textContent = "✏️";
          editBtn.onclick = () => editRecord(record.created);
          const deleteBtn = document.createElement("button");
          deleteBtn.className = "admin-btn-icon delete";
          deleteBtn.textContent = "🗑️";
          deleteBtn.onclick = () => deleteRecord(record.created);
          adminDiv.append(editBtn, deleteBtn);
          playerCell.append(adminDiv);
        }
     rank++;       
        row.append(playerCell, timeCell);
        tbody.append(row);
      }

      table.append(thead, tbody);
      tableContainer.append(table);
      gameGroup.append(tableContainer);
    }
    container.append(gameGroup);
  }

  const globalBest = [...records].sort((a, b) => a.ms - b.ms)[0];
  if (globalBest) {
    $("wrTime").textContent = formatTime(globalBest.ms);
    $("wrPlayer").replaceChildren(makePlayer(globalBest));
  } else {
    $("wrTime").textContent = "00h:00m:00s.000ms";
    $("wrPlayer").textContent = "Sin récords registrados";
  }
}

$("searchGame").addEventListener("input", render);

function showSubmission(show) {
  $("rankingPanel").hidden = show;
  $("submitPanel").hidden = !show;
  $("rankingButton").classList.toggle("active", !show);
  $("submitButton").classList.toggle("active", show);
}

$("rankingButton").onclick = () => {
  showSubmission(false);
  if (editingId) $("cancelEditBtn").click();
};
$("submitButton").onclick = () => showSubmission(true);

["hours", "minutes", "seconds", "milliseconds"].forEach(id => {
  $(id).addEventListener("input", () => {
    const time = readTime();
    $("timePreview").textContent = time === null ? "Completa el tiempo" : formatTime(time);
  });
});

$("recordForm").addEventListener("submit", event => {
  event.preventDefault();
  const game = $("gameName").value.trim();
  const category = $("category").value.trim() || "General"; 
  const name = $("playerName").value.trim();
  const country = $("country").value;
  const ms = readTime();
  const youtube = $("youtubeLink").value.trim();

  if (!game || !name || !country || ms === null || ms <= 0) {
    $("notice").textContent = "Completa los campos correctamente y pon un tiempo válido.";
    return;
  }

  try {
    if (editingId) {
      const index = records.findIndex(r => r.created === editingId);
      if (index !== -1) {
        records[index] = { ...records[index], game, category, name, country, ms, youtube };
      }
      $("notice").textContent = "Récord actualizado correctamente.";
      editingId = null;
      $("submitBtn").textContent = "Guardar récord";
      $("cancelEditBtn").style.display = "none";
      $("formTitle").textContent = "Enviar el récord";
    } else {
      records.push({ game, category, name, country, ms, youtube, created: Date.now() });
      $("notice").textContent = "Récord guardado correctamente.";
    }
    localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
  } catch {
    $("notice").textContent = "No se pudo guardar el récord.";
    return;
  }

  render();
  $("recordForm").reset();
  $("timePreview").textContent = "0h:00m:00s.000ms";
  showSubmission(false); 
  render();
  $("recordForm").reset();
  $("timePreview").textContent = "00h:00m:00s.000ms";
  showSubmission(false);
});

// Lógica del Modo Oscuro
$("themeBtn").onclick = () => {
  document.body.classList.toggle("dark-mode");
  if (document.body.classList.contains("dark-mode")) {
    $("themeBtn").textContent = "☀️";
  } else {
    $("themeBtn").textContent = "🌙";
  }
};

render();
</script>
</body>
</html>
