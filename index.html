<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpeedRun & Leaderboard Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Work+Sans:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f0d;
      --card-bg: #141c17;
      --border: #223027;
      --green: #10b981;
      --green-glow: rgba(16, 185, 129, 0.2);
      --text: #e2e8f0;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; line-height: 1.5; }
    h1, h2, h3 { font-family: 'Work Sans', sans-serif; letter-spacing: -0.02em; }
    
    /* Contenedor principal */
    .container { max-width: 1100px; margin: 0 auto; padding: 20px; }

    /* Cabecera / Navegación */
    header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid var(--border); margin-bottom: 30px; }
    .logo { font-size: 22px; font-weight: 800; color: var(--green); text-decoration: none; }
    nav a { color: var(--muted); text-decoration: none; margin-left: 20px; font-weight: 500; font-size: 14px; transition: color 0.2s; }
    nav a:hover { color: var(--green); }

    /* Sección Hero */
    .hero { text-align: center; padding: 40px 0; }
    .hero h1 { font-size: clamp(32px, 5vw, 48px); margin-bottom: 10px; color: #fff; }
    .hero p { color: var(--muted); font-size: 16px; max-width: 600px; margin: 0 auto; }

    /* Cuadrícula de Juegos */
    .section-title { font-size: 20px; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
    .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-bottom: 40px; }
    .game-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; transition: transform 0.2s, border-color 0.2s; cursor: pointer; }
    .game-card:hover { transform: translateY(-3px); border-color: var(--green); }
    .game-thumb { height: 140px; background: #1e2923; display: flex; align-items: center; justify-content: center; color: var(--muted); font-weight: 700; font-size: 14px; }
    .game-info { padding: 15px; }
    .game-info h3 { font-size: 16px; margin-bottom: 5px; color: #fff; }
    .game-info p { font-size: 13px; color: var(--muted); }

    .leaderboard-table { width: 100%; border-collapse: collapse; background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 40px; }
