<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LP Ranking</title>

<style>
:root {
  --bg-dark: #0f0f13;
  --surface: #1c1c24;
  --text-main: #ffffff;
  --text-muted: #8b8b9f;
  --accent: #f1c40f;
  --green: #166347;
  --red: #d32f2f;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background-color: var(--bg-dark);
  color: var(--text-main);
  font-family: system-ui, -apple-system, sans-serif;
}

header {
  padding: 20px;
  background-color: #15151a;
  border-bottom: 1px solid #2a2a35;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.header-content { display: flex; align-items: center; gap: 15px; }
.logo { font-size: 22px; font-weight: 800; }

#adminBtn {
  background: none; border: none; font-size: 22px; cursor: pointer; color: var(--text-muted);
}
#adminBtn.active { color: var(--red); }

main { max-width: 600px; margin: auto; padding: 20px 15px; }

#wrCard {
  background-color: var(--green); border: none; margin-bottom: 20px;
  border-radius: 16px; padding: 20px;
}
#wrCard .wr-title { font-size: 14px; font-weight: bold; color: white; }
#wrCard .wr-score { font-size: 30px; font-weight: 900; color: white; margin: 5px 0; }
#wrCard .wr-player { font-size: 15px; font-weight: bold; color: white; display: flex; align-items: center; gap: 8px; }

.tabs { display: flex; gap: 10px; margin-bottom: 20px; }
.tabs button {
  flex: 1; padding: 12px; border: 0; border-radius: 10px;
  background: #2a2a35; color: var(--text-muted); font-weight: bold; cursor: pointer;
}
.tabs button.active { background: var(--text-main); color: var(--bg-dark); }

.card {
  background-color: var(--surface); border-radius: 16px; padding: 20px; margin-bottom: 20px;
}

table { width: 100%; border-collapse: collapse; }
td { padding: 15px 5px; border-bottom: 1px solid #2a2a35; vertical-align: middle; }
tr:last-child td { border-bottom: 0; }

.rank { font-size: 16px; color: var(--text-muted); width: 40px; text-align: center; font-weight: bold; }
.rank.medal { font-size: 24px; }

.player { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.flag { width: 26px; height: 18px; border-radius: 3px; object-fit: cover; }

.score { text-align: right; font-size: 22px; font-weight: 900; color: var(--accent); }

form { display: grid; gap: 15px; }
label { display: grid; gap: 5px; color: var(--text-muted); font-size: 13px; font-weight: bold; }
input, select {
  width: 100%; padding: 12px; border: 1px solid #2a2a35; border-radius: 8px;
  background: #121214; color: white; font-size: 16px;
}
button[type="submit"] {
  padding: 14px; background: var(--accent); color: #000; border: none;
  border-radius: 10px; font-weight: 800; font-size: 16px; cursor: pointer;
}

.admin-actions { display: inline-flex; gap: 5px; margin-left: 10px; }
.admin-btn-icon {
  background: none; border: 1px solid #2a2a35; padding: 4px 8px;
  border-radius: 6px; cursor: pointer; font-size: 14px;
}
.admin-btn-icon.delete { color: var(--red); border-color: #ffcdd2; background: #ffebee; }
.admin-btn-icon.edit { color: #1976d2; border-color: #bbdefb; background: #e3f2fd; }

[hidden] { display: none !important; }
</style>
</head>

<body>

<header>
  <div class="header-content">
    <div class="logo">LP Ranking</div>
  </div>
  <button id="adminBtn" title="Panel de Moderador">⚙️</button>
</header>

<main>
  <div class="tabs">
    <button id="tabRanking" class="active">Global</button>
    <button id="tabSubmit">Tu marca aquí</button>
  </div>

  <section id="panelRanking">
    <div id="wrCard" hidden>
      <div class="wr-title">WR 🌏</div>
      <div class="wr-score" id="wrScore">0</div>
      <div class="wr-player" id="wrPlayer"></div>
    </div>

    <div id="rankingContainer"></div>
    <p id="emptyRanking" class="empty" style="text-align:center; color:#666;">Aún no hay clasificaciones</p>
  </section>

  <section id="panelSubmit" hidden>
    <div class="card">
      <h2>Registrar marca</h2>
      <form id="recordForm">
        <input type="hidden" id="editRecordId">
        <label>Nombre del juego <input id="gameName" maxlength="30" value="MiniHunter" required></label>
        <label>Nombre de usuario <input id="playerName" maxlength="20" required></label>
        <label>País <select id="country" required></select></label>
        
        <label>Tipo de Reto <select id="gameMode" required>
          <option value="menor">Menor puntuación (Cuanto menos, mejor)</option>
          <option value="mayor">Mayor puntuación (El más alto gana)</option>
        </select></label>

        <label>Puntuación <input id="score" type="number" min="0" max="999999" required></label>
        
        <button type="submit" id="submitBtn">Subir marca</button>
        <button type="button" id="cancelEditBtn" style="background: var(--text-muted); display: none;">Cancelar Edición</button>
      </form>
    </div>
  </section>
</main>

<script>
"use strict";

const ADMIN_PASSWORD = "admin123"; 
const $ = id => document.getElementById(id);
const STORAGE_KEY = "lp-ranking-v3"; // Cambiado a v3 para que no choque con errores viejos
let records = [];
let isAdmin = false;
let editingId = null;

const countries = {
  AD: "Andorra", AE: "Emiratos Árabes Unidos", AF: "Afganistán", AG: "Antigua y Barbuda", AI: "Anguila", AL: "Albania", AM: "Armenia", AO: "Angola", AQ: "Antártida", AR: "Argentina", AS: "Samoa Americana", AT: "Austria", AU: "Australia", AW: "Aruba", AX: "Islas Åland", AZ: "Azerbaiyán",
  BA: "Bosnia y Herzegovina", BB: "Barbados", BD: "Bangladés", BE: "Bélgica", BF: "Burkina Faso", BG: "Bulgaria", BH: "Baréin", BI: "Burundi", BJ: "Benín", BL: "San Bartolomé", BM: "Bermudas", BN: "Brunéi", BO: "Bolivia", BQ: "Bonaire, San Eustaquio y Saba", BR: "Brasil", BS: "Bahamas", BT: "Bután", BV: "Isla Bouvet", BW: "Botsuana", BY: "Bielorrusia", BZ: "Belice",
  CA: "Canadá", CC: "Islas Cocos", CD: "República Democrática del Congo", CF: "República Centroafricana", CG: "República del Congo", CH: "Suiza", CI: "Costa de Marfil", CK: "Islas Cook", CL: "Chile", CM: "Camerún", CN: "China", CO: "Colombia", CR: "Costa Rica", CU: "Cuba", CV: "Cabo Verde", CW: "Curazao", CX: "Isla de Navidad", CY: "Chipre", CZ: "Chequia",
  DE: "Alemania", DJ: "Yibuti", DK: "Dinamarca", DM: "Dominica", DO: "República Dominicana", DZ: "Argelia",
  EC: "Ecuador", EE: "Estonia", EG: "Egipto", EH: "Sáhara Occidental", ER: "Eritrea", ES: "España", ET: "Etiopía",
  FI: "Finlandia", FJ: "Fiyi", FK: "Islas Malvinas", FM: "Micronesia", FO: "Islas Feroe", FR: "Francia",
  GA: "Gabón", GB: "Reino Unido", GD: "Granada", GE: "Georgia", GF: "Guayana Francesa", GG: "Guernsey", GH: "Ghana", GI: "Gibraltar", GL: "Groenlandia", GM: "Gambia", GN: "Guinea", GP: "Guadalupe", GQ: "Guinea Ecuatorial", GR: "Grecia", GS: "Islas Georgias del Sur y Sandwich del Sur", GT: "Guatemala", GU: "Guam", GW: "Guinea-Bisáu", GY: "Guyana",
  HK: "Hong Kong", HM: "Islas Heard y McDonald", HN: "Honduras", HR: "Croacia", HT: "Haití", HU: "Hungría",
  ID: "Indonesia", IE: "Irlanda", IL: "Israel", IM: "Isla de Man", IN: "India", IO: "Territorio Británico del Océano Índico", IQ: "Irak", IR: "Irán", IS: "Islandia", IT: "Italia",
  JE: "Jersey", JM: "Jamaica", JO: "Jordania", JP: "Japón",
  KE: "Kenia", KG: "Kirguistán", KH: "Camboya", KI: "Kiribati", KM: "Comoras", KN: "San Cristóbal y Nieves", KP: "Corea del Norte", KR: "Corea del Sur", KW: "Kuwait", KY: "Islas Caimán", KZ: "Kazajistán",
  LA: "Laos", LB: "Líbano", LC: "Santa Lucía", LI: "Liechtenstein", LK: "Sri Lanka", LR: "Liberia", LS: "Lesoto", LT: "Lituania", LU: "Luxemburgo", LV: "Letonia", LY: "Libia",
  MA: "Marruecos", MC: "Mónaco", MD: "Moldavia", ME: "Montenegro", MF: "San Martín (parte francesa)", MG: "Madagascar", MH: "Islas Marshall", MK: "Macedonia del Norte", ML: "Malí", MM: "Myanmar", MN: "Mongolia", MO: "Macao", MP: "Islas Marianas del Norte", MQ: "Martinica", MR: "Mauritania", MS: "Montserrat", MT: "Malta", MU: "Mauricio", MV: "Maldivas", MW: "Malaui", MX: "México", MY: "Malasia", MZ: "Mozambique",
  NA: "Namibia", NC: "Nueva Caledonia", NE: "Níger", NF: "Isla Norfolk", NG: "Nigeria", NI: "Nicaragua", NL: "Países Bajos", NO: "Noruega", NP: "Nepal", NR: "Nauru", NU: "Niue", NZ: "Nueva Zelanda",
  OM: "Omán",
  PA: "Panamá", PE: "Perú", PF: "Polinesia Francesa", PG: "Papúa Nueva Guinea", PH: "Filipinas", PK: "Pakistán", PL: "Polonia", PM: "San Pedro y Miquelón", PN: "Islas Pitcairn", PR: "Puerto Rico", PS: "Palestina", PT: "Portugal", PW: "Palaos", PY: "Paraguay",
  QA: "Catar",
  RE: "Reunión", RO: "Rumanía", RS: "Serbia", RU: "Rusia", RW: "Ruanda",
  SA: "Arabia Saudita", SB: "Islas Salomón", SC: "Seychelles", SD: "Sudán", SE: "Suecia", SG: "Singapur", SH: "Santa Elena, Ascensión y Tristán de Acuña", SI: "Eslovenia", SJ: "Svalbard y Jan Mayen", SK: "Eslovaquia", SL: "Sierra Leona", SM: "San Marino", SN: "Senegal", SO: "Somalia", SR: "Surinam", SS: "Sudán del Sur", ST: "Santo Tomé y Príncipe", SV: "El Salvador", SX: "San Martín (parte neerlandesa)", SY: "Siria", SZ: "Esuatini",
  TC: "Islas Turcas y Caicos", TD: "Chad", TF: "Tierras Australes Francesas", TG: "Togo", TH: "Tailandia", TJ: "Tayikistán", TK: "Tokelau", TL: "Timor Oriental", TM: "Turkmenistán", TN: "Túnez", TO: "Tonga", TR: "Turquía", TT: "Trinidad y Tobago", TV: "Tuvalu", TW: "Taiwán", TZ: "Tanzania",
  UA: "Ucrania", UG: "Uganda", UM: "Islas menores alejadas de Estados Unidos", US: "Estados Unidos", UY: "Uruguay", UZ: "Uzbekistán",
  VA: "Ciudad del Vaticano", VC: "San Vicente y las Granadinas", VE: "Venezuela", VG: "Islas Vírgenes Británicas", VI: "Islas Vírgenes de Estados Unidos", VN: "Vietnam", VU: "Vanuatu",
  WF: "Wallis y Futuna", WS: "Samoa",
  YE: "Yemen", YT: "Mayotte",
  ZA: "Sudáfrica", ZM: "Zambia", ZW: "Zimbabue"
};

function flagEmoji(code) {
  return [...code].map(letter => String.fromCodePoint(127397 + letter.charCodeAt(0))).join("");
}

$("country").add(new Option("Selecciona tu país", ""));
Object.entries(countries).sort((a, b) => a[1].localeCompare(b[1], "es")).forEach(([code, name]) => {
  $("country").add(new Option(`${flagEmoji(code)} ${name}`, code));
});

try {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved !== null) records = JSON.parse(saved);
} catch { records = []; }

$("adminBtn").onclick = () => {
  if (isAdmin) {
    isAdmin = false;
    $("adminBtn").classList.remove("active");
    render();
  } else {
    const pass = prompt("Introduce la contraseña de moderador:");
    if (pass === ADMIN_PASSWORD) {
      isAdmin = true;
      $("adminBtn").classList.add("active");
      render();
    } else if (pass !== null) {
      alert("Contraseña incorrecta.");
    }
  }
};

function deleteRecord(id) {
  if (!isAdmin) return;
  if (confirm("¿Eliminar esta marca?")) {
    records = records.filter(r => r.created !== id);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    render();
  }
}

function editRecord(id) {
  if (!isAdmin) return;
  const record = records.find(r => r.created === id);
  if (!record) return;

  $("gameName").value = record.game;
  $("playerName").value = record.name;
  $("country").value = record.country;
  $("gameMode").value = record.mode;
  $("score").value = record.score;

  editingId = id;
  $("submitBtn").textContent = "Actualizar marca";
  $("cancelEditBtn").style.display = "block";
  switchTab(false);
}

$("cancelEditBtn").onclick = () => {
  editingId = null;
  $("recordForm").reset();
  $("submitBtn").textContent = "Subir marca";
  $("cancelEditBtn").style.display = "none";
  switchTab(true);
};

function render() {
  const container = $("rankingContainer");
  container.replaceChildren();
  $("wrCard").hidden = records.length === 0;

  if (records.length === 0) {
    $("emptyRanking").hidden = false;
    return;
  } else {
    $("emptyRanking").hidden = true;
  }

  const grouped = {};
  for (const record of records) {
    const key = `${record.game} (${record.mode === "mayor" ? "Máxima" : "Mínima"})`;
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push(record);
  }

  const sortedKeys = Object.keys(grouped).sort((a,b) => a.localeCompare(b));

  for (const key of sortedKeys) {
    const gameGroup = document.createElement("div");
    gameGroup.className = "card";
    
    const gameTitle = document.createElement("h2");
    gameTitle.style.margin = "0 0 15px 0";
    gameTitle.style.fontSize = "18px";
    gameTitle.textContent = key;
    gameGroup.append(gameTitle);

    const table = document.createElement("table");
    const tbody = document.createElement("tbody");

    const catRecords = grouped[key].sort((a, b) => {
      return key.includes("Máxima") ? (b.score - a.score) : (a.score - b.score);
    });

    catRecords.forEach((record, index) => {
      const tr = document.createElement("tr");
      
      const rankTd = document.createElement("td");
      rankTd.className = "rank";
      if (index === 0) rankTd.innerHTML = "🥇";
      else if (index === 1) rankTd.innerHTML = "🥈";
      else if (index === 2) rankTd.innerHTML = "🥉";
      else rankTd.textContent = `#${index + 1}`;
      
      const playerTd = document.createElement("td");
      playerTd.className = "player";
      const img = document.createElement("img");
      img.src = `https://flagcdn.com/w40/${record.country.toLowerCase()}.png`;
      img.className = "flag";
      const nameSpan = document.createElement("span");
      nameSpan.textContent = record.name;
      playerTd.append(img, nameSpan);

      if (isAdmin) {
        const adminDiv = document.createElement("div");
        adminDiv.className = "admin-actions";
        const editBtn = document.createElement("button");
        editBtn.className = "admin-btn-icon edit";
        editBtn.textContent = "✏️";
        editBtn.onclick = () => editRecord(record.created);
        const deleteBtn = document.createElement("button");
        deleteBtn.className = "admin-btn-icon delete";
        deleteBtn.textContent = "🗑️";
        deleteBtn.onclick = () => deleteRecord(record.created);
        adminDiv.append(editBtn, deleteBtn);
        playerTd.append(adminDiv);
      }

      const scoreTd = document.createElement("td");
      scoreTd.className = "score";
      scoreTd.textContent = record.score;

      tr.append(rankTd, playerTd, scoreTd);
      tbody.append(tr);
    });

    table.append(tbody);
    gameGroup.append(table);
    container.append(gameGroup);
  }

  const globalWr = [...records].sort((a, b) => {
    return a.mode === "mayor" ? (b.score - a.score) : (a.score - b.score);
  })[0];
  
  if (globalWr) {
    $("wrScore").textContent = globalWr.score + " pts";
    $("wrPlayer").replaceChildren();
    const img = document.createElement("img");
    img.src = `https://flagcdn.com/w40/${globalWr.country.toLowerCase()}.png`;
    img.style.width = "20px";
    img.style.borderRadius = "3px";
    const span = document.createElement("span");
    span.textContent = globalWr.name;
    $("wrPlayer").append(img, span);
  }
}

function switchTab(showRanking) {
  $("panelRanking").hidden = !showRanking;
  $("panelSubmit").hidden = showRanking;
  $("tabRanking").classList.toggle("active", showRanking);
  $("tabSubmit").classList.toggle("active", !showRanking);
}

$("tabRanking").onclick = () => switchTab(true);
$("tabSubmit").onclick = () => switchTab(false);

$("recordForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const game = $("gameName").value.trim();
  const name = $("playerName").value.trim();
  const country = $("country").value;
  const mode = $("gameMode").value;
  const score = Number($("score").value);

  if (!game || !name || !country || isNaN(score)) return;

  if (editingId) {
    const index = records.findIndex(r => r.created === editingId);
    if (index !== -1) {
      records[index] = { ...records[index], game, name, country, mode, score };
    }
    editingId = null;
    $("submitBtn").textContent = "Subir marca";
    $("cancelEditBtn").style.display = "none";
  } else {
    records.push({ game, name, country, mode, score, created: Date.now() });
  }
  
  localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
  render();
  $("recordForm").reset();
  switchTab(true);
});

render();
</script>

</body>
</html>
