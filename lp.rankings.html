<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LP Rankings</title>

<style>
:root {
  --bg-main: #0f0f13; --bg-surface: #1c1c24; --bg-header: #15151a;
  --text-main: #ffffff; --text-muted: #8b8b9f; --accent: #f1c40f;
  --green: #166347; --red: #d32f2f; --border: #2a2a35;
}
body.light-mode {
  --bg-main: #f4f7f5; --bg-surface: #ffffff; --bg-header: #ffffff;
  --text-main: #183225; --text-muted: #64766a; --border: #dce7df; --green: #166347;
}
* { box-sizing: border-box; }
body {
  margin: 0; background-color: var(--bg-main); color: var(--text-main);
  font-family: system-ui, -apple-system, sans-serif; transition: background 0.3s, color 0.3s;
}
header {
  padding: 20px; background-color: var(--bg-header); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.header-content { display: flex; align-items: center; gap: 15px; }
.logo { font-size: 22px; font-weight: 800; }
.header-actions { display: flex; gap: 10px; align-items: center; }
.icon-btn { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--text-muted); }
#adminBtn.active { color: var(--red); }
main { max-width: 600px; margin: auto; padding: 20px 15px; }

.wr-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
.wr-card { background-color: var(--green); border: none; border-radius: 12px; padding: 15px; color: white; }
.wr-title { font-size: 12px; font-weight: bold; opacity: 0.9; margin-bottom: 5px; }
.wr-score { font-size: 24px; font-weight: 900; margin: 5px 0; }
.wr-player { font-size: 13px; font-weight: bold; display: flex; align-items: center; gap: 8px; }
.wr-player img { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; border: 2px solid white; }

.tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
.tabs button {
  flex: 1; padding: 12px; border: 0; border-radius: 10px; min-width: 100px;
  background: var(--bg-surface); color: var(--text-muted); font-weight: bold; cursor: pointer; border: 1px solid var(--border);
}
.tabs button.active { background: var(--text-main); color: var(--bg-main); border-color: var(--text-main); }
.card { background-color: var(--bg-surface); border-radius: 16px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--border); }
table { width: 100%; border-collapse: collapse; }
td { padding: 15px 5px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
.rank { font-size: 16px; color: var(--text-muted); width: 40px; text-align: center; font-weight: bold; }

.player { display: flex; align-items: center; gap: 12px; font-weight: 600; }
.avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--border); background: #333; }
.player-info { display: flex; flex-direction: column; }
.player-name { font-size: 15px; }
.player-desc { font-size: 11px; color: var(--text-muted); font-weight: normal; }
.flag { width: 20px; height: 14px; border-radius: 2px; object-fit: cover; margin-left: 5px; }
.score { text-align: right; font-size: 22px; font-weight: 900; color: var(--accent); }

form { display: grid; gap: 15px; }
label { display: grid; gap: 5px; color: var(--text-muted); font-size: 13px; font-weight: bold; }
input, select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-main); color: var(--text-main); font-size: 16px; }
button[type="submit"] { padding: 14px; background: var(--accent); color: #000; border: none; border-radius: 10px; font-weight: 800; font-size: 16px; cursor: pointer; }

.admin-actions { display: inline-flex; gap: 5px; margin-left: 10px; }
.admin-btn-icon { background: none; border: 1px solid var(--border); padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 14px; }
.admin-btn-icon.delete { color: var(--red); border-color: var(--red); }
.admin-btn-icon.edit { color: #1976d2; border-color: #1976d2; }
.admin-btn-icon.accept { color: var(--green); border-color: var(--green); font-weight: bold; }
.verify-item { margin-bottom: 10px; padding: 10px; background: var(--bg-main); border-radius: 8px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.verify-info { display: flex; align-items: center; gap: 10px; }
[hidden] { display: none !important; }
</style>
</head>

<body>

<header>
  <div class="header-content">
    <div class="logo">LP Rankings</div>
  </div>
  <div class="header-actions">
    <button id="themeBtn" class="icon-btn" title="Modo Claro/Oscuro">☀️</button>
    <button id="adminBtn" class="icon-btn" title="Panel de Moderador">⚙️</button>
  </div>
</header>

<main>
  <div class="tabs">
    <button id="tabRanking" class="active">Global</button>
    <button id="tabSubmit">Tu marca aquí</button>
    <button id="tabVerify" style="display: none; background: var(--red); color: white;">Verificar</button>
  </div>

  <section id="panelRanking">
    <div class="wr-container" id="wrContainer" hidden>
      <div class="wr-card">
        <div class="wr-title">WR Mínima ⏱️</div>
        <div class="wr-score" id="wrScoreMin">0</div>
        <div class="wr-player" id="wrPlayerMin"></div>
      </div>
      <div class="wr-card" style="background-color: #2b6cb0;">
        <div class="wr-title">WR Máxima 🏆</div>
        <div class="wr-score" id="wrScoreMax">0</div>
        <div class="wr-player" id="wrPlayerMax"></div>
      </div>
    </div>
    <div id="rankingContainer"></div>
    <p id="emptyRanking" class="empty" style="text-align:center; color:var(--text-muted);">Aún no hay clasificaciones</p>
  </section>

  <section id="panelSubmit" hidden>
    <div class="card">
      <h2 id="formTitle">Registrar marca</h2>
      <form id="recordForm">
        <input type="hidden" id="editRecordId">
        <label>Nombre del juego <input id="gameName" maxlength="30" value="Reto Principal" required></label>
        <label>Nombre de usuario <input id="playerName" maxlength="20" required></label>
        <label>URL de tu foto de perfil (opcional) <input id="avatarUrl" type="url" placeholder="https://ejemplo.com/mi-foto.jpg"></label>
        <label>Descripción corta / Rango (opcional) <input id="playerDesc" maxlength="30" placeholder="Ej: Nivel 50 - Épico"></label>
        <label>País <select id="country" required></select></label>
        <label>Tipo de Reto <select id="gameMode" required>
          <option value="menor">Menor puntuación (Cuanto menos, mejor)</option>
          <option value="mayor">Mayor puntuación (El más alto gana)</option>
        </select></label>
        <label>Puntuación <input id="score" type="number" min="0" max="999999" required></label>
        <button type="submit" id="submitBtn">Subir marca</button>
        <button type="button" id="cancelEditBtn" style="background: var(--text-muted); display: none;">Cancelar Edición</button>
      </form>
      <p style="font-size:12px; color:var(--text-muted); margin-top:15px; text-align:center;">Tu marca será revisada por un administrador antes de ser publicada.</p>
    </div>
  </section>

  <section id="panelVerify" hidden>
    <div class="card">
      <h2>Marcas Pendientes</h2>
      <div id="verifyContainer"></div>
      <p id="emptyVerify" style="text-align:center; color:var(--text-muted); display: none;">No hay marcas pendientes.</p>
    </div>
  </section>
</main> 
  <script>
"use strict";

const ADMIN_PASSWORD = "admin123"; 
const $ = id => document.getElementById(id);
const STORAGE_KEY = "lp-ranking-final-v5";
let records = [];
let pendingRecords = [];
let isAdmin = false;
let editingId = null;

const countries = {
  AD: "Andorra", AE: "Emiratos Árabes Unidos", AF: "Afganistán", AG: "Antigua y Barbuda", AI: "Anguila", AL: "Albania", AM: "Armenia", AO: "Angola", AQ: "Antártida", AR: "Argentina", AS: "Samoa Americana", AT: "Austria", AU: "Australia", AW: "Aruba", AX: "Islas Åland", AZ: "Azerbaiyán",
  BA: "Bosnia y Herzegovina", BB: "Barbados", BD: "Bangladés", BE: "Bélgica", BF: "Burkina Faso", BG: "Bulgaria", BH: "Baréin", BI: "Burundi", BJ: "Benín", BL: "San Bartolomé", BM: "Bermudas", BN: "Brunéi", BO: "Bolivia", BQ: "Bonaire, San Eustaquio y Saba", BR: "Brasil", BS: "Bahamas", BT: "Bután", BV: "Isla Bouvet", BW: "Botsuana", BY: "Bielorrusia", BZ: "Belice",
  CA: "Canadá", CC: "Islas Cocos", CD: "República Democrática del Congo", CF: "República Centroafricana", CG: "República del Congo", CH: "Suiza", CI: "Costa de Marfil", CK: "Islas Cook", CL: "Chile", CM: "Camerún", CN: "China", CO: "Colombia", CR: "Costa Rica", CU: "Cuba", CV: "Cabo Verde", CW: "Curazao", CX: "Isla de Navidad", CY: "Chipre", CZ: "Chequia",
  DE: "Alemania", DJ: "Yibuti", DK: "Dinamarca", DM: "Dominica", DO: "República Dominicana", DZ: "Argelia",
  EC: "Ecuador", EE: "Estonia", EG: "Egipto", EH: "Sáhara Occidental", ER: "Eritrea", ES: "España", ET: "Etiopía",
  FI: "Finlandia", FJ: "Fiyi", FK: "Islas Malvinas", FM: "Micronesia", FO: "Islas Feroe", FR: "Francia",
  GA: "Gabón", GB: "Reino Unido", GD: "Granada", GE: "Georgia", GF: "Guayana Francesa", GG: "Guernsey", GH: "Ghana", GI: "Gibraltar", GL: "Groenlandia", GM: "Gambia", GN: "Guinea", GP: "Guadalupe", GQ: "Guinea Ecuatorial", GR: "Grecia", GS: "Islas Georgias del Sur y Sandwich del Sur", GT: "Guatemala", GU: "Guam", GW: "Guinea-Bisáu", GY: "Guyana",
  HK: "Hong Kong", HM: "Islas Heard y McDonald", HN: "Honduras", HR: "Croacia", HT: "Haití", HU: "Hungría",
  ID: "Indonesia", IE: "Irlanda", IL: "Israel", IM: "Isla de Man", IN: "India", IO: "Territorio Británico del Océano Índico", IQ: "Irak", IR: "Irán", IS: "Islandia", IT: "Italia",
  JE: "Jersey", JM: "Jamaica", JO: "Jordania", JP: "Japón",
  KE: "Kenia", KG: "Kirguistán", KH: "Camboya", KI: "Kiribati", KM: "Comoras", KN: "San Cristóbal y Nieves", KP: "Corea del Norte", KR: "Corea del Sur", KW: "Kuwait", KY: "Islas Caimán", KZ: "Kazajistán",
  LA: "Laos", LB: "Líbano", LC: "Santa Lucía", LI: "Liechtenstein", LK: "Sri Lanka", LR: "Liberia", LS: "Lesoto", LT: "Lituania", LU: "Luxemburgo", LV: "Letonia", LY: "Libia",
  MA: "Marruecos", MC: "Mónaco", MD: "Moldavia", ME: "Montenegro", MF: "San Martín (parte francesa)", MG: "Madagascar", MH: "Islas Marshall", MK: "Macedonia del Norte", ML: "Malí", MM: "Myanmar", MN: "Mongolia", MO: "Macao", MP: "Islas Marianas del Norte", MQ: "Martinica", MR: "Mauritania", MS: "Montserrat", MT: "Malta", MU: "Mauricio", MV: "Maldivas", MW: "Malaui", MX: "México", MY: "Malasia", MZ: "Mozambique",
  NA: "Namibia", NC: "Nueva Caledonia", NE: "Níger", NF: "Isla Norfolk", NG: "Nigeria", NI: "Nicaragua", NL: "Países Bajos", NO: "Noruega", NP: "Nepal", NR: "Nauru", NU: "Niue", NZ: "Nueva Zelanda",
  OM: "Omán",
  PA: "Panamá", PE: "Perú", PF: "Polinesia Francesa", PG: "Papúa Nueva Guinea", PH: "Filipinas", PK: "Pakistán", PL: "Polonia", PM: "San Pedro y Miquelón", PN: "Islas Pitcairn", PR: "Puerto Rico", PS: "Palestina", PT: "Portugal", PW: "Palaos", PY: "Paraguay",
  QA: "Catar",
  RE: "Reunión", RO: "Rumanía", RS: "Serbia", RU: "Rusia", RW: "Ruanda",
  SA: "Arabia Saudita", SB: "Islas Salomón", SC: "Seychelles", SD: "Sudán", SE: "Suecia", SG: "Singapur", SH: "Santa Elena, Ascensión y Tristán de Acuña", SI: "Eslovenia", SJ: "Svalbard y Jan Mayen", SK: "Eslovaquia", SL: "Sierra Leona", SM: "San Marino", SN: "Senegal", SO: "Somalia", SR: "Surinam", SS: "Sudán del Sur", ST: "Santo Tomé y Príncipe", SV: "El Salvador", SX: "San Martín (parte neerlandesa)", SY: "Siria", SZ: "Esuatini",
  TC: "Islas Turcas y Caicos", TD: "Chad", TF: "Tierras Australes Francesas", TG: "Togo", TH: "Tailandia", TJ: "Tayikistán", TK: "Tokelau", TL: "Timor Oriental", TM: "Turkmenistán", TN: "Túnez", TO: "Tonga", TR: "Turquía", TT: "Trinidad y Tobago", TV: "Tuvalu", TW: "Taiwán", TZ: "Tanzania",
  UA: "Ucrania", UG: "Uganda", UM: "Islas menores alejadas de Estados Unidos", US: "Estados Unidos", UY: "Uruguay", UZ: "Uzbekistán",
  VA: "Ciudad del Vaticano", VC: "San Vicente y las Granadinas", VE: "Venezuela", VG: "Islas Vírgenes Británicas", VI: "Islas Vírgenes de Estados Unidos", VN: "Vietnam", VU: "Vanuatu",
  WF: "Wallis y Futuna", WS: "Samoa",
  YE: "Yemen", YT: "Mayotte",
  ZA: "Sudáfrica", ZM: "Zambia", ZW: "Zimbabue"
};

function flagEmoji(code) {
  return [...code].map(letter => String.fromCodePoint(127397 + letter.charCodeAt(0))).join("");
}

$("country").add(new Option("Selecciona tu país", ""));
Object.entries(countries).sort((a, b) => a[1].localeCompare(b[1], "es")).forEach(([code, name]) => {
  $("country").add(new Option(`${flagEmoji(code)} ${name}`, code));
});

try {
  const savedRecs = localStorage.getItem(STORAGE_KEY + "_approved");
  const savedPend = localStorage.getItem(STORAGE_KEY + "_pending");
  if (savedRecs) records = JSON.parse(savedRecs);
  if (savedPend) pendingRecords = JSON.parse(savedPend);
} catch { records = []; pendingRecords = []; }

$("adminBtn").onclick = () => {
  if (isAdmin) {
    isAdmin = false;
    $("adminBtn").classList.remove("active");
    $("tabVerify").style.display = "none";
    switchTab("ranking");
    render();
  } else {
    const pass = prompt("Contraseña de moderador:");
    if (pass === ADMIN_PASSWORD) {
      isAdmin = true;
      $("adminBtn").classList.add("active");
      $("tabVerify").style.display = "block";
      $("tabVerify").textContent = `Verificar (${pendingRecords.length})`;
      render(); renderVerify();
    } else if (pass !== null) alert("Contraseña incorrecta.");
  }
};

$("themeBtn").onclick = () => {
  document.body.classList.toggle("light-mode");
  $("themeBtn").textContent = document.body.classList.contains("light-mode") ? "🌙" : "☀️";
};

// EDITAR RÉCORD
function editRecord(id) {
  if (!isAdmin) return;
  const record = records.find(r => r.created === id);
  if (!record) return;

  $("gameName").value = record.game;
  $("playerName").value = record.name;
  $("avatarUrl").value = record.avatar || "";
  $("playerDesc").value = record.desc || "";
  $("country").value = record.country;
  $("gameMode").value = record.mode;
  $("score").value = record.score;

  editingId = id;
  $("submitBtn").textContent = "Actualizar marca";
  $("cancelEditBtn").style.display = "block";
  $("formTitle").textContent = "Editar marca";
  switchTab("submit");
}

$("cancelEditBtn").onclick = () => {
  editingId = null;
  $("recordForm").reset();
  $("submitBtn").textContent = "Subir marca";
  $("cancelEditBtn").style.display = "none";
  $("formTitle").textContent = "Registrar marca";
  switchTab("ranking");
};

$("recordForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const game = $("gameName").value.trim();
  const name = $("playerName").value.trim();
  const country = $("country").value;
  const mode = $("gameMode").value;
  const score = Number($("score").value);
  const avatar = $("avatarUrl").value.trim();
  const desc = $("playerDesc").value.trim();

  if (!game || !name || !country || isNaN(score)) return;

  if (editingId) {
    const index = records.findIndex(r => r.created === editingId);
    if (index !== -1) {
      records[index] = { ...records[index], game, name, country, mode, score, avatar, desc };
    }
    localStorage.setItem(STORAGE_KEY + "_approved", JSON.stringify(records));
    editingId = null;
    $("submitBtn").textContent = "Subir marca";
    $("cancelEditBtn").style.display = "none";
    $("formTitle").textContent = "Registrar marca";
    $("recordForm").reset();
    switchTab("ranking");
    render();
  } else {
    pendingRecords.push({ game, name, country, mode, score, avatar, desc, created: Date.now() });
    localStorage.setItem(STORAGE_KEY + "_pending", JSON.stringify(pendingRecords));
    
    $("recordForm").reset();
    switchTab("ranking");
    alert("Marca enviada. Espera a que un administrador la verifique.");
    if (isAdmin) $("tabVerify").textContent = `Verificar (${pendingRecords.length})`;
  }
});

function acceptRecord(id) {
  const index = pendingRecords.findIndex(r => r.created === id);
  if (index !== -1) {
    records.push(pendingRecords[index]);
    pendingRecords.splice(index, 1);
    localStorage.setItem(STORAGE_KEY + "_approved", JSON.stringify(records));
    localStorage.setItem(STORAGE_KEY + "_pending", JSON.stringify(pendingRecords));
    $("tabVerify").textContent = `Verificar (${pendingRecords.length})`;
    render(); renderVerify();
  }
}

function rejectRecord(id) {
  if (confirm("¿Rechazar esta marca permanentemente?")) {
    pendingRecords = pendingRecords.filter(r => r.created !== id);
    localStorage.setItem(STORAGE_KEY + "_pending", JSON.stringify(pendingRecords));
    $("tabVerify").textContent = `Verificar (${pendingRecords.length})`;
    renderVerify();
  }
}

function deleteRecord(id) {
  if (!isAdmin) return;
  if (confirm("¿Eliminar esta marca de la tabla?")) {
    records = records.filter(r => r.created !== id);
    localStorage.setItem(STORAGE_KEY + "_approved", JSON.stringify(records));
    render();
  }
}

function render() {
  const container = $("rankingContainer");
  container.replaceChildren();
  const minRecords = records.filter(r => r.mode === "menor").sort((a, b) => a.score - b.score);
  const maxRecords = records.filter(r => r.mode === "mayor").sort((a, b) => b.score - a.score);

  $("wrContainer").hidden = records.length === 0;

  if (minRecords.length > 0) {
    const r = minRecords[0];
    $("wrScoreMin").textContent = r.score;
    $("wrPlayerMin").innerHTML = `${r.avatar ? `<img src="${r.avatar}">` : ''} <img src="https://flagcdn.com/w40/${r.country.toLowerCase()}.png"> ${r.name}`;
  } else { $("wrScoreMin").textContent = "0"; $("wrPlayerMin").textContent = "Sin marcas"; }

  if (maxRecords.length > 0) {
    const r = maxRecords[0];
    $("wrScoreMax").textContent = r.score;
    $("wrPlayerMax").innerHTML = `${r.avatar ? `<img src="${r.avatar}">` : ''} <img src="https://flagcdn.com/w40/${r.country.toLowerCase()}.png"> ${r.name}`;
  } else { $("wrScoreMax").textContent = "0"; $("wrPlayerMax").textContent = "Sin marcas"; }

  const grouped = {};
  records.forEach(r => {
    const key = `${r.game} (${r.mode === "mayor" ? "Máxima" : "Mínima"})`;
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push(r);
  });

  const sortedKeys = Object.keys(grouped).sort((a,b) => a.localeCompare(b));

  for (const key of sortedKeys) {
    const gameGroup = document.createElement("div");
    gameGroup.className = "card";
    const gameTitle = document.createElement("h2");
    gameTitle.style.margin = "0 0 15px 0"; gameTitle.style.fontSize = "18px";
    gameTitle.textContent = key; gameGroup.append(gameTitle);

    const table = document.createElement("table");
    const tbody = document.createElement("tbody");
    const catRecords = grouped[key].sort((a, b) => key.includes("Máxima") ? (b.score - a.score) : (a.score - b.score));

    catRecords.forEach((record, index) => {
      const tr = document.createElement("tr");
      const rankTd = document.createElement("td");
      rankTd.className = "rank";
      rankTd.innerHTML = index === 0 ? "🥇" : index === 1 ? "🥈" : index === 2 ? "🥉" : `#${index + 1}`;
      const playerTd = document.createElement("td");
      playerTd.className = "player";
      let avatarHtml = record.avatar 
        ? `<img src="${record.avatar}" class="avatar" onerror="this.src='https://ui-avatars.com/api/?name=${record.name}&background=random&color=fff'">` 
        : `<img src="https://ui-avatars.com/api/?name=${record.name}&background=random&color=fff" class="avatar">`;

      playerTd.innerHTML = `
        ${avatarHtml}
        <div class="player-info">
          <span class="player-name">${record.name} <img src="https://flagcdn.com/w40/${record.country.toLowerCase()}.png" class="flag"></span>
          ${record.desc ? `<span class="player-desc">${record.desc}</span>` : ''}
        </div>
      `;

      if (isAdmin) {
        const adminDiv = document.createElement("div");
        adminDiv.className = "admin-actions";
        adminDiv.innerHTML = `
          <button class="admin-btn-icon edit" onclick="editRecord(${record.created})">✏️</button>
          <button class="admin-btn-icon delete" onclick="deleteRecord(${record.created})">🗑️</button>
        `;
        playerTd.append(adminDiv);
      }

      const scoreTd = document.createElement("td");
      scoreTd.className = "score"; scoreTd.textContent = record.score;
      tr.append(rankTd, playerTd, scoreTd);
      tbody.append(tr);
    });

    table.append(tbody); gameGroup.append(table); container.append(gameGroup);
  }
  $("emptyRanking").hidden = records.length > 0;
}

function renderVerify() {
  const container = $("verifyContainer");
  container.replaceChildren();
  $("emptyVerify").style.display = pendingRecords.length === 0 ? "block" : "none";

  pendingRecords.forEach(record => {
    const div = document.createElement("div");
    div.className = "verify-item";
    let avatarHtml = record.avatar 
        ? `<img src="${record.avatar}" class="avatar" style="width:30px;height:30px;">` 
        : `<img src="https://ui-avatars.com/api/?name=${record.name}&background=random&color=fff" class="avatar" style="width:30px;height:30px;">`;

    div.innerHTML = `
      <div class="verify-info">
        ${avatarHtml}
        <div>
          <b>${record.name}</b> (${countries[record.country]})<br>
          <small style="color:var(--text-muted)">${record.game} - ${record.mode} - ${record.score}</small>
        </div>
      </div>
      <div>
        <button class="admin-btn-icon accept" onclick="acceptRecord(${record.created})">Aceptar</button>
        <button class="admin-btn-icon delete" onclick="rejectRecord(${record.created})">Rechazar</button>
      </div>
    `;
    container.append(div);
  });
}

function switchTab(tabName) {
  $("panelRanking").hidden = tabName !== "ranking";
  $("panelSubmit").hidden = tabName !== "submit";
  $("panelVerify").hidden = tabName !== "verify";
  $("tabRanking").classList.toggle("active", tabName === "ranking");
  $("tabSubmit").classList.toggle("active", tabName === "submit");
  $("tabVerify").classList.toggle("active", tabName === "verify");
  if (tabName === "verify" && isAdmin) renderVerify();
}

$("tabRanking").onclick = () => switchTab("ranking");
$("tabSubmit").onclick = () => switchTab("submit");
$("tabVerify").onclick = () => switchTab("verify");

render();
</script>
</body>
</html>
