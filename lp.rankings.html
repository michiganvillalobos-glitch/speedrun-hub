<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LP Rankings Pro</title>

<style>
:root {
  --bg-main: #0f0f13; --bg-surface: #1c1c24; --bg-header: #15151a;
  --text-main: #ffffff; --text-muted: #8b8b9f; --accent: #f1c40f;
  --green: #166347; --red: #d32f2f; --border: #2a2a35; --blue: #2b6cb0;
}
body.light-mode {
  --bg-main: #f4f7f5; --bg-surface: #ffffff; --bg-header: #ffffff;
  --text-main: #183225; --text-muted: #64766a; --border: #dce7df; --green: #166347;
}
* { box-sizing: border-box; }
body {
  margin: 0; background-color: var(--bg-main); color: var(--text-main);
  font-family: system-ui, -apple-system, sans-serif; transition: background 0.3s, color 0.3s;
}
header {
  padding: 20px; background-color: var(--bg-header); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100;
}
.header-content { display: flex; align-items: center; gap: 15px; }
.logo { font-size: 22px; font-weight: 900; letter-spacing: 1px; }
.logo span { color: var(--accent); }
.header-actions { display: flex; gap: 10px; align-items: center; }
.icon-btn { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--text-muted); }
#adminBtn.active { color: var(--red); }
main { max-width: 700px; margin: auto; padding: 20px 15px 100px; }

/* TARJETAS WR */
.wr-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
.wr-card { background: linear-gradient(135deg, var(--green) 0%, #0d3a29 100%); border-radius: 16px; padding: 20px; color: white; }
.wr-card.max { background: linear-gradient(135deg, var(--blue) 0%, #1a3e66 100%); }
.wr-title { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
.wr-score-container { display: flex; align-items: baseline; gap: 5px; margin: 5px 0; }
.wr-score { font-size: 32px; font-weight: 900; line-height: 1; }
.wr-pts { font-size: 16px; font-weight: 700; color: rgba(255,255,255,0.7); text-transform: lowercase; }
.wr-player { font-size: 13px; font-weight: bold; display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.wr-player img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; border: 2px solid white; }

/* TABS Y BOTONES */
.tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
.tabs button {
  flex: 1; padding: 12px; border: 0; border-radius: 10px; min-width: 100px;
  background: var(--bg-surface); color: var(--text-muted); font-weight: bold; cursor: pointer; border: 1px solid var(--border);
}
.tabs button.active { background: var(--text-main); color: var(--bg-main); border-color: var(--text-main); }
.sub-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
.sub-tabs button {
  flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border);
  background: transparent; color: var(--text-muted); font-weight: bold; cursor: pointer;
}
.sub-tabs button.active { background: var(--accent); color: #000; border-color: var(--accent); }

.card { background-color: var(--bg-surface); border-radius: 16px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--border); }
table { width: 100%; border-collapse: collapse; }
td { padding: 15px 5px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
.rank { font-size: 16px; color: var(--text-muted); width: 40px; text-align: center; font-weight: bold; }

/* JUGADOR */
.player { display: flex; align-items: center; gap: 12px; font-weight: 600; }
.avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--border); background: #333; }
.player-info { display: flex; flex-direction: column; }
.player-name { font-size: 15px; display: flex; align-items: center; }
.player-desc { font-size: 11px; color: var(--text-muted); font-weight: normal; }
.flag { width: 20px; height: 14px; border-radius: 2px; object-fit: cover; margin-left: 6px; }

/* SCORE (PUNTOS) */
.score-container { text-align: right; display: flex; align-items: baseline; justify-content: flex-end; gap: 4px; }
.score { font-size: 20px; font-weight: 900; color: var(--accent); }
.score-pts { font-size: 11px; font-weight: bold; color: var(--text-muted); }

/* TIME (TIEMPO) */
.time-display { text-align: right; font-size: 16px; font-weight: 800; color: var(--green); white-space: nowrap; font-variant-numeric: tabular-nums; }
.video-link { display: inline-block; margin-left: 10px; color: var(--red); text-decoration: none; font-size: 12px; font-weight: bold; }

/* FORMULARIOS */
form { display: grid; gap: 15px; }
label { display: grid; gap: 5px; color: var(--text-muted); font-size: 13px; font-weight: bold; }
input, select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-main); color: var(--text-main); font-size: 16px; }
button[type="submit"] { padding: 14px; background: var(--accent); color: #000; border: none; border-radius: 10px; font-weight: 800; font-size: 16px; cursor: pointer; }

/* FORMULARIO DINÁMICO */
.time-fields { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 5px; }
.time-fields input { text-align: center; padding: 10px 5px; }
.yt-toggle { display: flex; align-items: center; justify-content: space-between; background: var(--bg-main); border: 1px solid var(--border); border-radius: 8px; padding: 12px; cursor: pointer; }
.yt-toggle input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; accent-color: var(--accent); }

/* ADMIN */
.admin-actions { display: inline-flex; gap: 5px; margin-left: 10px; }
.admin-btn-icon { background: none; border: 1px solid var(--border); padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 14px; }
.admin-btn-icon.delete { color: var(--red); border-color: var(--red); }
.admin-btn-icon.edit { color: #1976d2; border-color: #1976d2; }
.admin-btn-icon.accept { color: var(--green); border-color: var(--green); font-weight: bold; }
.admin-btn-icon.verify { color: #3b82f6; border-color: #3b82f6; }
.verify-item { margin-bottom: 10px; padding: 10px; background: var(--bg-main); border-radius: 8px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.verify-info { display: flex; align-items: center; gap: 10px; }

/* TIEMPOS TABLA ESPECIAL */
.time-table-title { font-size: 18px; font-weight: 800; margin-bottom: 10px; color: var(--text-main); display: flex; align-items: center; gap: 8px; }
.time-category { display: inline-block; background: var(--bg-main); padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; color: var(--text-muted); margin-bottom: 10px; }

[hidden] { display: none !important; }
</style>
</head>

<body>

<header>
  <div class="header-content"><div class="logo">LP<span>RANKINGS</span></div></div>
  <div class="header-actions">
    <button id="themeBtn" class="icon-btn">☀️</button>
    <button id="adminBtn" class="icon-btn">⚙️</button>
  </div>
</header>

<main>
  <div class="tabs">
    <button id="tabRanking" class="active">Rankings</button>
    <button id="tabSubmit">Tu marca aquí</button>
    <button id="tabProfile">Mi Perfil</button>
    <button id="tabVerify" style="display: none; background: var(--red); color: white;">Verificar</button>
  </div>
    <section id="panelRanking">
    <!-- WR DE PUNTOS -->
    <div class="wr-container" id="wrContainer" hidden>
      <div class="wr-card">
        <div class="wr-title">WR Mínima 🌏</div>
        <div class="wr-score-container">
          <span class="wr-score" id="wrScoreMin">0</span>
          <span class="wr-pts">pts</span>
        </div>
        <div class="wr-player" id="wrPlayerMin"></div>
      </div>
      <div class="wr-card max">
        <div class="wr-title">WR Máxima 🌏🏆</div>
        <div class="wr-score-container">
          <span class="wr-score" id="wrScoreMax">0</span>
          <span class="wr-pts">pts</span>
        </div>
        <div class="wr-player" id="wrPlayerMax"></div>
      </div>
    </div>

    <!-- SUBTABS: PUNTOS O TIEMPOS -->
    <div class="sub-tabs" id="rankingSubTabs" hidden>
      <button id="subTabMin" class="active" onclick="switchRankingTab('min')">⏱️ Puntaje Mínimo</button>
      <button id="subTabMax" onclick="switchRankingTab('max')">🏆 Puntaje Máximo</button>
      <button id="subTabTime" onclick="switchRankingTab('time')">⏳ Tiempos (Speedruns)</button>
    </div>

    <!-- CONTENEDOR DE PUNTOS -->
    <div id="rankingContainer"></div>
    <!-- CONTENEDOR DE TIEMPOS -->
    <div id="timeContainer" hidden></div>
    
    <p id="emptyRanking" class="empty" style="text-align:center; color:var(--text-muted);">Aún no hay clasificaciones</p>
  </section>

  <!-- FORMULARIO DINÁMICO -->
  <section id="panelSubmit" hidden>
    <div class="card">
      <h2 id="formTitle">Registrar marca</h2>
      <form id="recordForm">
        <input type="hidden" id="editRecordId">
        
        <label>Nombre del juego <input id="gameName" maxlength="30" value="Reto Principal" required></label>
        
        <!-- SELECTOR DE TIPO DE RETO -->
        <label>Tipo de Reto <select id="recordType" required onchange="toggleFormFields()">
          <option value="puntuacion">Puntuación (Puntos)</option>
          <option value="tiempo">Tiempo (Speedrun)</option>
        </select></label>

        <!-- CAMPOS PARA PUNTOS -->
        <div id="fieldsPuntos">
          <label>Tipo de Puntuación <select id="gameMode" required>
            <option value="menor">Menor puntuación (Cuanto menos, mejor)</option>
            <option value="mayor">Mayor puntuación (El más alto gana)</option>
          </select></label>
          <label>Puntuación <input id="score" type="number" min="0" max="999999" placeholder="Ej: 7583"></label>
        </div>

        <!-- CAMPOS PARA TIEMPO -->
        <div id="fieldsTiempo" hidden>
          <label>Categoría del Speedrun <input id="timeCategory" maxlength="30" placeholder="Ej: Any%, 10th Place..."></label>
          <label>Tiempo exacto (Horas, Minutos, Segundos, Milisegundos)</label>
          <div class="time-fields">
            <input id="tHours" type="number" placeholder="00" min="0">
            <input id="tMins" type="number" placeholder="00" min="0" max="59">
            <input id="tSecs" type="number" placeholder="00" min="0" max="59">
            <input id="tMs" type="number" placeholder="000" min="0" max="999">
          </div>
        </div>

        <label>Nombre de usuario <input id="playerName" maxlength="20" required></label>
        <label>URL de tu foto de perfil (opcional) <input id="avatarUrl" type="url"></label>
        <label>Descripción corta (opcional) <input id="playerDesc" maxlength="30"></label>
        <label>País <select id="country" required></select></label>
        <label>PIN Secreto (4 números) <input id="playerPin" type="number" required></label>
        
        <label class="yt-toggle">
          <span>¿Deseas agregar un link de YouTube?</span>
          <input type="checkbox" id="hasYoutube" onchange="toggleYoutubeField()">
        </label>
        <div id="youtubeField" hidden>
          <label>Link de YouTube <input id="videoUrl" type="url" placeholder="https://youtu.be/..."></label>
        </div>
        
        <button type="submit" id="submitBtn">Subir marca</button>
        <button type="button" id="cancelEditBtn" style="background: var(--text-muted); display: none;">Cancelar Edición</button>
      </form>
    </div>
  </section>

  <section id="panelProfile" hidden>
    <div class="card">
      <h2>Mi Perfil</h2>
      <form id="loginPinForm">
        <label>Ingresa tu PIN para editar tus datos <input id="loginPinInput" type="number" required></label>
        <button type="submit">Entrar a mi perfil</button>
      </form>
      <div id="profileEditSection" hidden style="margin-top: 20px; border-top: 1px solid var(--border); padding-top: 20px;">
        <form id="profileForm">
          <input type="hidden" id="profileRecordId">
          <label>Nuevo Nombre <input id="profName" type="text" required></label>
          <label>Nueva Foto (URL) <input id="profAvatar" type="url"></label>
          <label>Nuevo País <select id="profCountry" required></select></label>
          <label>Nueva Descripción <input id="profDesc" type="text"></label>
          <button type="submit">Guardar Cambios</button>
        </form>
      </div>
    </div>
  </section>

  <section id="panelVerify" hidden>
    <div class="card">
      <h2>Marcas Pendientes</h2>
      <div id="verifyContainer"></div>
      <p id="emptyVerify" style="text-align:center; color:var(--text-muted); display: none;">No hay marcas pendientes.</p>
    </div>
  </section>
</main>

function flagEmoji(code) { return [...code].map(l => String.fromCodePoint(127397 + l.charCodeAt(0))).join(""); }

["country", "profCountry"].forEach(id => {
  const el = $(id);
  if (el) {
    el.add(new Option("Selecciona tu país", ""));
    Object.entries(countries).sort((a, b) => a[1].localeCompare(b[1], "es")).forEach(([code, name]) => {
      el.add(new Option(`${flagEmoji(code)} ${name}`, code));
    });
  }
});

try {
  const savedRecs = localStorage.getItem(STORAGE_KEY + "_approved");
  const savedPend = localStorage.getItem(STORAGE_KEY + "_pending");
  if (savedRecs) records = JSON.parse(savedRecs);
  if (savedPend) pendingRecords = JSON.parse(savedPend);
} catch { records = []; pendingRecords = []; }

function toggleYoutubeField() {
  const isChecked = $("hasYoutube").checked;
  $("youtubeField").hidden = !isChecked;
  if (!isChecked) $("videoUrl").value = ""; 
}

function toggleFormFields() {
  const type = $("recordType").value;
  if (type === "puntuacion") {
    $("fieldsPuntos").hidden = false;
    $("fieldsTiempo").hidden = true;
    $("score").required = true;
  } else {
    $("fieldsPuntos").hidden = true;
    $("fieldsTiempo").hidden = false;
    $("score").required = false;

}

  <script>
// ADMIN
$("adminBtn").onclick = () => {
  if (isAdmin) {
    isAdmin = false;
    $("adminBtn").classList.remove("active");
    $("tabVerify").style.display = "none";
    switchTab("ranking"); renderAll();
  } else {
    const pass = prompt("Contraseña de moderador:");
    if (pass === ADMIN_PASSWORD) {
      isAdmin = true;
      $("adminBtn").classList.add("active");
      $("tabVerify").style.display = "block";
      $("tabVerify").textContent = `Verificar (${pendingRecords.length})`;
      renderAll(); renderVerify();
    } else if (pass !== null) alert("Contraseña incorrecta.");
  }
};

$("themeBtn").onclick = () => {
  document.body.classList.toggle("light-mode");
  $("themeBtn").textContent = document.body.classList.contains("light-mode") ? "🌙" : "☀️";
};

function switchRankingTab(mode) {
  currentRankingMode = mode;
  $("subTabMax").classList.toggle("active", mode === "max");
  $("subTabMin").classList.toggle("active", mode === "min");
  $("subTabTime").classList.toggle("active", mode === "time");
  renderAll();
}

// FORMATEAR TIEMPO
function formatTime(ms) {
  const hours = Math.floor(ms / 3600000);
  const minutes = Math.floor(ms / 60000) % 60;
  const seconds = Math.floor(ms / 1000) % 60;
  const milliseconds = ms % 1000;
  return (String(hours).padStart(2, "0") + "h:" + String(minutes).padStart(2, "0") + "m:" + String(seconds).padStart(2, "0") + "s." + String(milliseconds).padStart(3, "0") + "ms");
}

// ENVIAR / EDITAR
$("recordForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const game = $("gameName").value.trim();
  const name = $("playerName").value.trim();
  const country = $("country").value;
  const type = $("recordType").value;
  const avatar = $("avatarUrl").value.trim();
  const desc = $("playerDesc").value.trim();
  const pin = $("playerPin").value.trim();
  const video = $("hasYoutube").checked ? $("videoUrl").value.trim() : "";

  let data = { game, name, country, type, avatar, desc, pin, video, verified: false, created: Date.now() };

  if (type === "puntuacion") {
    const mode = $("gameMode").value;
    const score = Number($("score").value);
    if (!game || !name || !country || isNaN(score) || pin.length < 4) { alert("Faltan datos."); return; }
    data.mode = mode; data.score = score;
  } else {
    const cat = $("timeCategory").value.trim() || "Any%";
    const h = Number($("tHours").value) || 0;
    const m = Number($("tMins").value) || 0;
    const s = Number($("tSecs").value) || 0;
    const ms = Number($("tMs").value) || 0;
    if (!game || !name || !country || pin.length < 4) { alert("Faltan datos."); return; }
    data.category = cat; data.ms = (h * 3600000) + (m * 60000) + (s * 1000) + ms;
  }

  if (editingId) {
    const index = records.findIndex(r => r.created === editingId);
    if (index !== -1) {
      records[index] = { ...records[index], ...data };
    }
    localStorage.setItem(STORAGE_KEY + "_approved", JSON.stringify(records));
    editingId = null;
    resetForm(); switchTab("ranking"); renderAll();
  } else {
    pendingRecords.push(data);
    localStorage.setItem(STORAGE_KEY + "_pending", JSON.stringify(pendingRecords));
    resetForm(); switchTab("ranking");
    alert("Marca enviada. Espera verificación.");
    if (isAdmin) $("tabVerify").textContent = `Verificar (${pendingRecords.length})`;
  }
});

function resetForm() {
  $("recordForm").reset();
  $("hasYoutube").checked = false; toggleYoutubeField();
  $("submitBtn").textContent = "Subir marca";
  $("cancelEditBtn").style.display = "none";
  $("formTitle").textContent = "Registrar marca";
  toggleFormFields();
}

function editRecord(id) {
  if (!isAdmin) return;
  const record = records.find(r => r.created === id);
  if (!record) return;

  $("gameName").value = record.game;
  $("playerName").value = record.name;
  $("avatarUrl").value = record.avatar || "";
  $("playerDesc").value = record.desc || "";
  $("country").value = record.country;
  $("playerPin").value = record.pin || "";
  $("recordType").value = record.type;
  toggleFormFields();

  if (record.type === "puntuacion") {
    $("gameMode").value = record.mode;
    $("score").value = record.score;
  } else {
    $("timeCategory").value = record.category || "";
    $("tHours").value = Math.floor(record.ms / 3600000);
    $("tMins").value = Math.floor(record.ms / 60000) % 60;
    $("tSecs").value = Math.floor(record.ms / 1000) % 60;
    $("tMs").value = record.ms % 1000;
  }

  if (record.video) { $("hasYoutube").checked = true; toggleYoutubeField(); $("videoUrl").value = record.video; }
  else { $("hasYoutube").checked = false; toggleYoutubeField(); }

  editingId = id;
  $("submitBtn").textContent = "Actualizar marca";
  $("cancelEditBtn").style.display = "block";
  $("formTitle").textContent = "Editar marca";
  switchTab("submit");
}

$("cancelEditBtn").onclick = () => { editingId = null; resetForm(); switchTab("ranking"); };

// PERFIL
$("loginPinForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const pin = $("loginPinInput").value.trim();
  const playerRecord = records.find(r => r.pin === pin);
  if (!playerRecord) { alert("PIN incorrecto."); return; }
  if (playerRecord.verified) { alert("Tu cuenta ya está verificada. No puedes editarla."); return; }
  
  $("profileRecordId").value = playerRecord.created;
  $("profName").value = playerRecord.name;
  $("profAvatar").value = playerRecord.avatar || "";
  $("profCountry").value = playerRecord.country;
  $("profDesc").value = playerRecord.desc || "";
  $("loginPinForm").hidden = true;
  $("profileEditSection").hidden = false;
});

$("profileForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const id = Number($("profileRecordId").value);
  const index = records.findIndex(r => r.created === id);
  if (index !== -1) {
    records[index].name = $("profName").value.trim();
    records[index].avatar = $("profAvatar").value.trim();
    records[index].country = $("profCountry").value;
    records[index].desc = $("profDesc").value.trim();
    localStorage.setItem(STORAGE_KEY + "_approved", JSON.stringify(records));
    alert("Perfil actualizado.");
    $("loginPinForm").reset(); $("loginPinForm").hidden = false;
    $("profileEditSection").hidden = true;
    switchTab("ranking"); renderAll();
  }
});

// VERIFICACIÓN Y BORRADO (ADMIN)
function acceptRecord(id) {
  const index = pendingRecords.findIndex(r => r.created === id);
  if (index !== -1) {
    records.push(pendingRecords[index]);
    pendingRecords.splice(index, 1);
    localStorage.setItem(STORAGE_KEY + "_approved", JSON.stringify(records));
    localStorage.setItem(STORAGE_KEY + "_pending", JSON.stringify(pendingRecords));
    $("tabVerify").textContent = `Verificar (${pendingRecords.length})`;
    renderAll(); renderVerify();
  }
}
function rejectRecord(id) {
  if (confirm("¿Rechazar esta marca?")) {
    pendingRecords = pendingRecords.filter(r => r.created !== id);
    localStorage.setItem(STORAGE_KEY + "_pending", JSON.stringify(pendingRecords));
    $("tabVerify").textContent = `Verificar (${pendingRecords.length})`;
    renderVerify();
  }
}
function deleteRecord(id) {
  if (!isAdmin) return;
  if (confirm("¿Eliminar esta marca de la tabla?")) {
    records = records.filter(r => r.created !== id);
    localStorage.setItem(STORAGE_KEY + "_approved", JSON.stringify(records));
    renderAll();
  }
}
function toggleVerify(id) {
  if (!isAdmin) return;
  const index = records.findIndex(r => r.created === id);
  if (index !== -1) {
    records[index].verified = !records[index].verified;
    localStorage.setItem(STORAGE_KEY + "_approved", JSON.stringify(records));
    renderAll();
  }
}

// RENDERIZAR TODO
function renderAll() {
  // Filtrar datos por tipo de reto
  const pointsRecords = records.filter(r => r.type === "puntuacion");
  const timeRecords = records.filter(r => r.type === "tiempo");

  const minRecords = pointsRecords.filter(r => r.mode === "menor").sort((a, b) => a.score - b.score);
  const maxRecords = pointsRecords.filter(r => r.mode === "mayor").sort((a, b) => b.score - a.score);

  $("wrContainer").hidden = pointsRecords.length === 0;
  $("rankingSubTabs").hidden = records.length === 0;

  // Actualizar WR de Puntos
  if (minRecords.length > 0) {
    const r = minRecords[0];
    $("wrScoreMin").textContent = r.score;
    $("wrPlayerMin").innerHTML = `${r.avatar ? `<img src="${r.avatar}">` : ''} <img src="https://flagcdn.com/w40/${r.country.toLowerCase()}.png"> ${r.name}`;
  } else { $("wrScoreMin").textContent = "0"; $("wrPlayerMin").textContent = "Sin marcas"; }

  if (maxRecords.length > 0) {
    const r = maxRecords[0];
    $("wrScoreMax").textContent = r.score;
    $("wrPlayerMax").innerHTML = `${r.avatar ? `<img src="${r.avatar}">` : ''} <img src="https://flagcdn.com/w40/${r.country.toLowerCase()}.png"> ${r.name}`;
  } else { $("wrScoreMax").textContent = "0"; $("wrPlayerMax").textContent = "Sin marcas"; }

  // Renderizar tabla de Puntos
  const containerPoints = $("rankingContainer");
  const containerTime = $("timeContainer");
  containerPoints.replaceChildren();
  containerTime.replaceChildren();

  if (currentRankingMode === "time") {
    containerPoints.hidden = true;
    containerTime.hidden = false;
    renderTimeTable(timeRecords, containerTime);
  } else {
    containerPoints.hidden = false;
    containerTime.hidden = true;
    const filteredRecords = currentRankingMode === "max" ? maxRecords : minRecords;
    renderPointsTable(filteredRecords, containerPoints);
  }

  $("emptyRanking").hidden = (currentRankingMode === "time" ? timeRecords.length > 0 : (currentRankingMode === "max" ? maxRecords.length > 0 : minRecords.length > 0));
}

function renderPointsTable(filtered, container) {
  const grouped = {};
  filtered.forEach(r => {
    if (!grouped[r.game]) grouped[r.game] = [];
    grouped[r.game].push(r);
  });

  const sortedKeys = Object.keys(grouped).sort((a,b) => a.localeCompare(b));

  for (const key of sortedKeys) {
    const gameGroup = document.createElement("div");
    gameGroup.className = "card";
    gameGroup.innerHTML = `<h2 style="margin:0 0 15px 0;font-size:18px;">${key}</h2>`;

    const table = document.createElement("table");
    const tbody = document.createElement("tbody");

    grouped[key].forEach((record, index) => {
      const tr = document.createElement("tr");
      const rankTd = document.createElement("td");
      rankTd.className = "rank";
      rankTd.innerHTML = index === 0 ? "🥇" : index === 1 ? "🥈" : index === 2 ? "🥉" : `#${index + 1}`;
      
      const playerTd = document.createElement("td");
      playerTd.className = "player";
      let avatarHtml = record.avatar ? `<img src="${record.avatar}" class="avatar" onerror="this.src='https://ui-avatars.com/api/?name=${record.name}&background=random&color=fff'">` : `<img src="https://ui-avatars.com/api/?name=${record.name}&background=random&color=fff" class="avatar">`;

      playerTd.innerHTML = `
        ${avatarHtml}
        <div class="player-info">
          <span class="player-name">
            ${record.name} 
            ${record.verified ? '✔️' : ''} 
            <img src="https://flagcdn.com/w40/${record.country.toLowerCase()}.png" class="flag">
          </span>
          ${record.desc ? `<span class="player-desc">${record.desc}</span>` : ''}
        </div>
      `;

      if (isAdmin) {
        const adminDiv = document.createElement("div");
        adminDiv.className = "admin-actions";
        adminDiv.innerHTML = `
          <button class="admin-btn-icon verify" onclick="toggleVerify(${record.created})" title="Verificar">${record.verified ? '✔️' : '☑️'}</button>
          <button class="admin-btn-icon edit" onclick="editRecord(${record.created})">✏️</button>
          <button class="admin-btn-icon delete" onclick="deleteRecord(${record.created})">🗑️</button>
        `;
        playerTd.append(adminDiv);
      }

      const scoreTd = document.createElement("td");
      scoreTd.innerHTML = `<div class="score-container"><span class="score">${record.score}</span> <span class="score-pts">pts</span></div>`;

      tr.append(rankTd, playerTd, scoreTd);
      tbody.append(tr);
    });

    table.append(tbody);
    gameGroup.append(table);
    container.append(gameGroup);
  }
}

function renderTimeTable(timeRecords, container) {
  const grouped = {};
  timeRecords.forEach(r => {
    const key = `${r.game} (${r.category})`;
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push(r);
  });

  const sortedKeys = Object.keys(grouped).sort((a,b) => a.localeCompare(b));

  for (const key of sortedKeys) {
    const gameGroup = document.createElement("div");
    gameGroup.className = "card";
    const gameTitle = document.createElement("h2");
    gameTitle.className = "time-table-title";
    gameTitle.textContent = key; 
    gameGroup.append(gameTitle);

    const table = document.createElement("table");
    const tbody = document.createElement("tbody");
    const catRecords = grouped[key].sort((a, b) => a.ms - b.ms);

    catRecords.forEach((record, index) => {
      const tr = document.createElement("tr");
      const rankTd = document.createElement("td");
      rankTd.className = "rank";
      rankTd.innerHTML = index === 0 ? "🥇" : index === 1 ? "🥈" : index === 2 ? "🥉" : `#${index + 1}`;
      
      const playerTd = document.createElement("td");
      playerTd.className = "player";
      let avatarHtml = record.avatar ? `<img src="${record.avatar}" class="avatar" onerror="this.src='https://ui-avatars.com/api/?name=${record.name}&background=random&color=fff'">` : `<img src="https://ui-avatars.com/api/?name=${record.name}&background=random&color=fff" class="avatar">`;

      playerTd.innerHTML = `
        ${avatarHtml}
        <div class="player-info">
          <span class="player-name">
            ${record.name} 
            ${record.verified ? '✔️' : ''} 
            <img src="https://flagcdn.com/w40/${record.country.toLowerCase()}.png" class="flag">
          </span>
          ${record.desc ? `<span class="player-desc">${record.desc}</span>` : ''}
        </div>
      `;

      if (isAdmin) {
        const adminDiv = document.createElement("div");
        adminDiv.className = "admin-actions";
        adminDiv.innerHTML = `
          <button class="admin-btn-icon verify" onclick="toggleVerify(${record.created})" title="Verificar">${record.verified ? '✔️' : '☑️'}</button>
          <button class="admin-btn-icon edit" onclick="editRecord(${record.created})">✏️</button>
          <button class="admin-btn-icon delete" onclick="deleteRecord(${record.created})">🗑️</button>
        `;
        playerTd.append(adminDiv);
      }

      const timeTd = document.createElement("td");
      timeTd.innerHTML = `<div class="time-display">${index === 0 ? '👑 ' : ''}${formatTime(record.ms)} ${record.video ? `<a href="${record.video}" target="_blank" class="video-link">▶ Video</a>` : ''}</div>`;

      tr.append(rankTd, playerTd, timeTd);
      tbody.append(tr);
    });

    table.append(tbody);
    gameGroup.append(table);
    container.append(gameGroup);
  }
}

function renderVerify() {
  const container = $("verifyContainer");
  container.replaceChildren();
  $("emptyVerify").style.display = pendingRecords.length === 0 ? "block" : "none";

  pendingRecords.forEach(record => {
    const div = document.createElement("div");
    div.className = "verify-item";
    let avatarHtml = record.avatar ? `<img src="${record.avatar}" class="avatar" style="width:30px;height:30px;">` : `<img src="https://ui-avatars.com/api/?name=${record.name}&background=random&color=fff" class="avatar" style="width:30px;height:30px;">`;
    const info = record.type === "puntuacion" ? `${record.score} pts` : formatTime(record.ms);

    div.innerHTML = `
      <div class="verify-info">
        ${avatarHtml}
        <div>
          <b>${record.name}</b> (${countries[record.country]})<br>
          <small style="color:var(--text-muted)">${record.game} - ${record.type === 'tiempo' ? record.category : record.mode} - ${info}</small>
        </div>
      </div>
      <div>
        <button class="admin-btn-icon accept" onclick="acceptRecord(${record.created})">Aceptar</button>
        <button class="admin-btn-icon delete" onclick="rejectRecord(${record.created})">Rechazar</button>
      </div>
    `;
    container.append(div);
  });
}

function switchTab(tabName) {
  $("panelRanking").hidden = tabName !== "ranking";
  $("panelSubmit").hidden = tabName !== "submit";
  $("panelProfile").hidden = tabName !== "profile";
  $("panelVerify").hidden = tabName !== "verify";
  
  $("tabRanking").classList.toggle("active", tabName === "ranking");
  $("tabSubmit").classList.toggle("active", tabName === "submit");
  $("tabProfile").classList.toggle("active", tabName === "profile");
  $("tabVerify").classList.toggle("active", tabName === "verify");

  if (tabName === "verify" && isAdmin) renderVerify();
}

$("tabRanking").onclick = () => switchTab("ranking");
$("tabSubmit").onclick = () => switchTab("submit");
$("tabProfile").onclick = () => switchTab("profile");
$("tabVerify").onclick = () => switchTab("verify");

renderAll();
</script>
