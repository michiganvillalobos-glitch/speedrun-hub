<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Base Demon List</title>

<style>
:root {
  --bg-main: #0d0d12; --bg-surface: #1a1a22; --bg-header: #121218;
  --text-main: #ffffff; --text-muted: #8b8b9f; --accent: #a855f7;
  --green: #10b981; --red: #ef4444; --border: #2a2a35;
}

* { box-sizing: border-box; }
body { margin: 0; background-color: var(--bg-main); color: var(--text-main); font-family: system-ui, -apple-system, sans-serif; }

header {
  padding: 20px; background-color: var(--bg-header); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100;
}
.header-content { display: flex; align-items: center; gap: 15px; }
.logo { font-size: 22px; font-weight: 800; color: var(--accent); }
.icon-btn { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--text-muted); }
#adminBtn.active { color: var(--red); }

main { max-width: 800px; margin: auto; padding: 20px 15px 80px; }

/* Pestañas principales */
.main-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
.main-tabs button {
  background: none; border: none; color: var(--text-muted); font-size: 16px; font-weight: bold;
  cursor: pointer; padding: 10px; border-bottom: 3px solid transparent;
}
.main-tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }

/* Botones generales */
.btn-primary { padding: 12px; background: var(--accent); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 15px; }
.admin-only { display: none; }
body.is-admin .admin-only { display: block; }

/* Tarjetas de Niveles */
.level-card { background-color: var(--bg-surface); border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid var(--border); display: flex; gap: 15px; align-items: center; position: relative; }
.level-thumb { width: 100px; height: 60px; background: #333; border-radius: 6px; object-fit: cover; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #666; }
.level-info { flex-grow: 1; }
.level-rank { font-size: 20px; font-weight: 900; color: var(--accent); }
.level-title { font-size: 16px; font-weight: bold; margin: 2px 0; }
.level-details { font-size: 12px; color: var(--text-muted); display: flex; gap: 10px; margin-top: 5px; }
.level-points { font-size: 18px; font-weight: 900; color: var(--green); text-align: right; }

/* Tarjetas de Jugadores */
.player-card { background-color: var(--bg-surface); border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid var(--border); display: flex; align-items: center; gap: 15px; }
.player-rank { font-size: 18px; font-weight: 900; color: var(--accent); width: 30px; }
.player-avatar { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid var(--border); }
.player-name { font-size: 16px; font-weight: bold; }
.player-stats { font-size: 12px; color: var(--text-muted); display: flex; gap: 10px; margin-top: 5px; }
.player-points { margin-left: auto; font-size: 18px; font-weight: 900; color: var(--green); }

/* Admin Controls */
.admin-controls { display: none; flex-direction: column; gap: 5px; margin-left: 10px; }
body.is-admin .admin-controls { display: flex; }
.btn-icon { background: none; border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; cursor: pointer; font-size: 12px; color: white; }
.btn-icon.edit { color: #3b82f6; border-color: #3b82f6; }
.btn-icon.delete { color: var(--red); border-color: var(--red); }

/* Modal */
.modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
.modal-overlay.active { display: flex; }
.modal-content { background: var(--bg-surface); width: 100%; max-width: 500px; border-radius: 12px; padding: 20px; border: 1px solid var(--border); max-height: 90vh; overflow-y: auto; }
.modal-title { margin-top: 0; font-size: 18px; display: flex; align-items: center; gap: 10px; margin-bottom: 20px; color: var(--accent); }
form { display: grid; gap: 12px; }
label { display: grid; gap: 5px; color: var(--text-muted); font-size: 12px; font-weight: bold; }
input, select, textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-main); color: white; font-size: 14px; font-family: inherit; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.diff-options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.diff-btn { padding: 10px; background: var(--bg-main); border: 1px solid var(--border); border-radius: 8px; color: white; text-align: left; cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 8px; }
.diff-btn.active { border-color: var(--accent); background: rgba(168, 85, 247, 0.1); }
.modal-buttons { display: flex; gap: 10px; margin-top: 15px; }
.btn-save { flex: 1; padding: 12px; background: var(--green); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
.btn-cancel { flex: 1; padding: 12px; background: var(--bg-main); color: white; border: 1px solid var(--border); border-radius: 8px; font-weight: bold; cursor: pointer; }
.hidden { display: none !important; }
</style>
</head>

<body>

<header>
  <div class="header-content">
    <div class="logo">Base Demon List</div>
  </div>
  <button id="adminBtn" class="icon-btn" title="Panel de Moderador">⚙️</button>
</header>

<main>
  <div class="main-tabs">
    <button id="tabPlayers" class="active" onclick="switchView('players')">Jugadores</button>
    <button id="tabLevels" onclick="switchView('levels')">Lista de Niveles</button>
  </div>

  <!-- Vista de Jugadores -->
  <section id="viewPlayers">
    <button class="btn-primary admin-only" onclick="openPlayerModal()">+ Agregar Jugador</button>
    <div id="playerList"></div>
  </section>

  <!-- Vista de Niveles -->
  <section id="viewLevels" class="hidden">
    <button class="btn-primary admin-only" onclick="openLevelModal()">+ Agregar Nivel</button>
    <div id="levelList"></div>
  </section>
</main>

<!-- Modal Jugadores -->
<div class="modal-overlay" id="playerModal">
  <div class="modal-content">
    <h2 class="modal-title"><span>👤</span> <span id="playerModalTitle">Editar Jugador</span></h2>
    <form id="playerForm">
      <input type="hidden" id="editPlayerId">
      <label>Nombre del Jugador <input id="pName" type="text" required></label>
      <label>URL de Foto (Avatar) <input id="pAvatar" type="url" placeholder="https://..."></label>
      <label>URL de Bandera (País) <input id="pFlag" type="url" placeholder="https://flagcdn.com/w40/ve.png"></label>
      
      <label>Niveles Completados (Separados por coma, ej: Tendon, Bloodbath)
        <textarea id="pLevels" rows="3"></textarea>
      </label>

      <div class="modal-buttons">
        <button type="button" class="btn-cancel" onclick="closeModal('playerModal')">Cancelar</button>
        <button type="submit" class="btn-save">Guardar</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal Niveles -->
<div class="modal-overlay" id="levelModal">
  <div class="modal-content">
    <h2 class="modal-title"><span>✏️</span> <span id="levelModalTitle">Editar Nivel</span></h2>
    <form id="levelForm">
      <input type="hidden" id="editLevelId">
      <label>Nombre del Nivel <input id="lName" type="text" required></label>
      <div class="form-row">
        <label>Posición (#) <input id="lPos" type="number" required></label>
        <label>Puntos <input id="lPoints" type="number" step="0.01" required></label>
      </div>
      <label>Dificultad
        <div class="diff-options" id="diffOptions">
          <button type="button" class="diff-btn active" data-diff="Extreme Demon">🔴 Extreme Demon</button>
          <button type="button" class="diff-btn" data-diff="Insane Demon">🔴 Insane Demon</button>
          <button type="button" class="diff-btn" data-diff="Hard Demon">🟠 Hard Demon</button>
        </div>
      </label>
      <label>URL de la Imagen <input id="lImage" type="url"></label>
      <div class="modal-buttons">
        <button type="button" class="btn-cancel" onclick="closeModal('levelModal')">Cancelar</button>
        <button type="submit" class="btn-save">Guardar</button>
      </div>
    </form>
  </div>
</div>
<script>
"use strict";

const ADMIN_PASSWORD = "admin123";
const $ = id => document.getElementById(id);

let players = [];
let levels = [];
let isAdmin = false;
let currentDiff = "Extreme Demon";

// Cargar datos
try {
  const savedP = localStorage.getItem("demonlist_players");
  const savedL = localStorage.getItem("demonlist_levels");
  if (savedP) players = JSON.parse(savedP);
  if (savedL) levels = JSON.parse(savedL);
} catch { players = []; levels = []; }

// Admin Login
$("adminBtn").onclick = () => {
  if (isAdmin) {
    isAdmin = false;
    document.body.classList.remove("is-admin");
    $("adminBtn").classList.remove("active");
    renderAll();
  } else {
    const pass = prompt("Contraseña de admin:");
    if (pass === ADMIN_PASSWORD) {
      isAdmin = true;
      document.body.classList.add("is-admin");
      $("adminBtn").classList.add("active");
      renderAll();
    } else if (pass !== null) alert("Incorrecta.");
  }
};

// Cambiar de Pestaña
function switchView(view) {
  if (view === 'players') {
    $("viewPlayers").classList.remove("hidden");
    $("viewLevels").classList.add("hidden");
    $("tabPlayers").classList.add("active");
    $("tabLevels").classList.remove("active");
  } else {
    $("viewPlayers").classList.add("hidden");
    $("viewLevels").classList.remove("hidden");
    $("tabPlayers").classList.remove("active");
    $("tabLevels").classList.add("active");
  }
}

function closeModal(id) { $(id).classList.remove("active"); }

// --- LÓGICA NIVELES ---
document.querySelectorAll("#diffOptions .diff-btn").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll("#diffOptions .diff-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentDiff = btn.getAttribute("data-diff");
  };
});

function openLevelModal(id = null) {
  $("levelForm").reset();
  $("editLevelId").value = id || "";
  if (id) {
    const l = levels.find(x => x.id === id);
    $("levelModalTitle").textContent = "Editar Nivel";
    $("lName").value = l.name; $("lPos").value = l.pos; $("lPoints").value = l.points;
    $("lImage").value = l.image || "";
    currentDiff = l.difficulty;
  } else {
    $("levelModalTitle").textContent = "Agregar Nivel";
    currentDiff = "Extreme Demon";
  }
  $("levelModal").classList.add("active");
}

$("levelForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const id = $("editLevelId").value;
  const data = {
    id: id ? Number(id) : Date.now(),
    name: $("lName").value.trim(),
    pos: Number($("lPos").value),
    points: Number($("lPoints").value),
    difficulty: currentDiff,
    image: $("lImage").value.trim()
  };

  if (id) levels = levels.map(l => l.id === Number(id) ? data : l);
  else levels.push(data);

  localStorage.setItem("demonlist_levels", JSON.stringify(levels));
  closeModal("levelModal");
  renderAll();
});

function deleteLevel(id) {
  if (!isAdmin) return;
  if (confirm("¿Borrar nivel?")) {
    levels = levels.filter(l => l.id !== id);
    localStorage.setItem("demonlist_levels", JSON.stringify(levels));
    renderAll();
  }
}

// --- LÓGICA JUGADORES ---
function openPlayerModal(id = null) {
  $("playerForm").reset();
  $("editPlayerId").value = id || "";
  if (id) {
    const p = players.find(x => x.id === id);
    $("playerModalTitle").textContent = "Editar Jugador";
    $("pName").value = p.name;
    $("pAvatar").value = p.avatar || "";
    $("pFlag").value = p.flag || "";
    $("pLevels").value = p.completedLevels || "";
  } else {
    $("playerModalTitle").textContent = "Agregar Jugador";
  }
  $("playerModal").classList.add("active");
}

$("playerForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const id = $("editPlayerId").value;
  const data = {
    id: id ? Number(id) : Date.now(),
    name: $("pName").value.trim(),
    avatar: $("pAvatar").value.trim(),
    flag: $("pFlag").value.trim(),
    completedLevels: $("pLevels").value.trim()
  };

  if (id) players = players.map(p => p.id === Number(id) ? data : p);
  else players.push(data);

  localStorage.setItem("demonlist_players", JSON.stringify(players));
  closeModal("playerModal");
  renderAll();
});

function deletePlayer(id) {
  if (!isAdmin) return;
  if (confirm("¿Borrar jugador?")) {
    players = players.filter(p => p.id !== id);
    localStorage.setItem("demonlist_players", JSON.stringify(players));
    renderAll();
  }
}

// --- RENDERIZAR TODO ---
function renderAll() {
  renderLevels();
  renderPlayers();
}

function renderLevels() {
  const container = $("levelList");
  container.innerHTML = "";
  const sorted = [...levels].sort((a, b) => a.pos - b.pos);

  if (sorted.length === 0) {
    container.innerHTML = `<p style="text-align:center; color:var(--text-muted);">No hay niveles.</p>`;
    return;
  }

  sorted.forEach(l => {
    const card = document.createElement("div");
    card.className = "level-card";
    const img = l.image ? `<img src="${l.image}" class="level-thumb">` : `<div class="level-thumb">No Img</div>`;

    card.innerHTML = `
      <div class="level-rank">#${l.pos}</div>
      ${img}
      <div class="level-info">
        <div class="level-title">${l.name}</div>
        <div class="level-details"><span>💀 ${l.difficulty}</span></div>
      </div>
      <div class="level-points">${l.points} <br><span style="font-size:10px; color:var(--text-muted);">pts</span></div>
      <div class="admin-controls">
        <button class="btn-icon edit" onclick="openLevelModal(${l.id})">✏️</button>
        <button class="btn-icon delete" onclick="deleteLevel(${l.id})">🗑️</button>
      </div>
    `;
    container.append(card);
  });
}

function renderPlayers() {
  const container = $("playerList");
  container.innerHTML = "";

  // Calcular puntos de cada jugador según los niveles completados
  const rankedPlayers = players.map(p => {
    let totalPoints = 0;
    const completed = p.completedLevels ? p.completedLevels.split(',').map(s => s.trim().toLowerCase()) : [];
    
    levels.forEach(l => {
      if (completed.includes(l.name.toLowerCase())) {
        totalPoints += l.points;
      }
    });
    return { ...p, totalPoints };
  }).sort((a, b) => b.totalPoints - a.totalPoints); // Ordenar de mayor a menor

  if (rankedPlayers.length === 0) {
    container.innerHTML = `<p style="text-align:center; color:var(--text-muted);">No hay jugadores registrados.</p>`;
    return;
  }

  rankedPlayers.forEach((p, index) => {
    const card = document.createElement("div");
    card.className = "player-card";
    const avatar = p.avatar ? `<img src="${p.avatar}" class="player-avatar">` : `<div class="player-avatar" style="display:flex;align-items:center;justify-content:center;background:#333;">👤</div>`;
    const flag = p.flag ? `<img src="${p.flag}" style="height:14px;border-radius:2px;margin-left:5px;">` : "";

    card.innerHTML = `
      <div class="player-rank">#${index + 1}</div>
      ${avatar}
      <div>
        <div class="player-name">${p.name} ${flag}</div>
        <div class="player-stats">Completados: ${p.completedLevels || "Ninguno"}</div>
      </div>
      <div class="player-points">${p.totalPoints.toFixed(2)} <br><span style="font-size:10px; color:var(--text-muted);">pts</span></div>
      <div class="admin-controls">
        <button class="btn-icon edit" onclick="openPlayerModal(${p.id})">✏️</button>
        <button class="btn-icon delete" onclick="deletePlayer(${p.id})">🗑️</button>
      </div>
    `;
    container.append(card);
  });
}

// Iniciar
renderAll();
</script>
</body>
</html>
