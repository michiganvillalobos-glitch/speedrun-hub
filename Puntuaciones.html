<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LP Ranking</title>

<style>
:root {
  --bg-dark: #121214;
  --surface: #1e1e24;
  --text-main: #ffffff;
  --text-muted: #a0a0b0;
  --accent: #f1c40f;
  --green: #2ecc71;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background-color: var(--bg-dark);
  color: var(--text-main);
  font-family: system-ui, -apple-system, sans-serif;
}

header {
  padding: 20px;
  background-color: #1a1a1f;
  border-bottom: 1px solid #333;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo { font-size: 22px; font-weight: 800; }

main { max-width: 600px; margin: auto; padding: 20px 15px; }

/* Botones de pestaña */
.tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

.tabs button {
  flex: 1;
  padding: 12px;
  border: 0;
  border-radius: 10px;
  background: #2a2a30;
  color: var(--text-muted);
  font-weight: bold;
  cursor: pointer;
}
.tabs button.active {
  background: var(--text-main);
  color: var(--bg-dark);
}

/* Tarjeta del juego */
.card {
  background-color: var(--surface);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 20px;
}

.game-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}

.game-icon {
  width: 40px;
  height: 40px;
  background-color: var(--accent);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}

.game-info h2 { margin: 0; font-size: 18px; }
.game-info p { margin: 4px 0 0; color: var(--text-muted); font-size: 13px; }

/* Tabla de clasificación */
table { width: 100%; border-collapse: collapse; }

td {
  padding: 15px 5px;
  border-bottom: 1px solid #333;
  vertical-align: middle;
}
tr:last-child td { border-bottom: 0; }

.rank { font-size: 16px; color: var(--text-muted); width: 40px; text-align: center; font-weight: bold; }
.rank.medal { font-size: 24px; } /* Para las medallas */

.player { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.flag { width: 26px; height: 18px; border-radius: 3px; object-fit: cover; }

.score { text-align: right; font-size: 22px; font-weight: 900; color: var(--accent); }

/* Formulario */
form { display: grid; gap: 15px; }
label { display: grid; gap: 5px; color: var(--text-muted); font-size: 13px; font-weight: bold; }
input, select {
  width: 100%;
  padding: 12px;
  border: 1px solid #333;
  border-radius: 8px;
  background: #121214;
  color: white;
  font-size: 16px;
}
button[type="submit"] {
  padding: 14px;
  background: var(--accent);
  color: #000;
  border: none;
  border-radius: 10px;
  font-weight: 800;
  font-size: 16px;
  cursor: pointer;
}

[hidden] { display: none !important; }
</style>
</head>

<body>

<header>
  <div class="logo">Clasificaciones</div>
</header>

<main>
  <div class="tabs">
    <button id="tabRanking" class="active">Global</button>
    <button id="tabSubmit">Tu marca aquí</button>
  </div>

  <section id="panelRanking">
    <div class="card">
      <!-- Encabezado del juego -->
      <div class="game-header">
        <div class="game-icon">🔥</div>
        <div class="game-info">
          <h2 id="gameNameDisplay">MiniHunter</h2>
          <p>Cuanto menos, mejor</p>
        </div>
      </div>
      
      <!-- Tabla -->
      <table>
        <tbody id="rankingBody"></tbody>
      </table>
    </div>
  </section>

  <section id="panelSubmit" hidden>
    <div class="card">
      <h2>Registrar marca</h2>
      <form id="recordForm">
        <label>Nombre del juego <input id="gameName" maxlength="30" placeholder="Ej: MiniHunter" value="MiniHunter" required></label>
        <label>Nombre de usuario <input id="playerName" maxlength="20" placeholder="Tu nombre" required></label>
        <label>País <select id="country" required></select></label>
        <label>Puntos / Tiempo (número menor) <input id="score" type="number" min="1" max="9999" required></label>
        <button type="submit">Subir marca</button>
      </form>
    </div>
  </section>
</main>

<script>
"use strict";

const $ = id => document.getElementById(id);
const STORAGE_KEY = "geohunter-ranking-v1";
let records = [];

// Lista de países (puedes agregar más)
const countries = {
  AR: "Argentina", BO: "Bolivia", BR: "Brasil", CA: "Canadá", CL: "Chile", CN: "China", CO: "Colombia", CR: "Costa Rica", CU: "Cuba", DE: "Alemania", EC: "Ecuador", ES: "España", FR: "Francia", GB: "Reino Unido", GT: "Guatemala", HN: "Honduras", IT: "Italia", JP: "Japón", MX: "México", NI: "Nicaragua", PA: "Panamá", PE: "Perú", PR: "Puerto Rico", PY: "Paraguay", SV: "El Salvador", US: "Estados Unidos", UY: "Uruguay", VE: "Venezuela"
};

function flagEmoji(code) {
  return [...code].map(letter => String.fromCodePoint(127397 + letter.charCodeAt(0))).join("");
}

$("country").add(new Option("Selecciona tu país", ""));
Object.entries(countries).sort((a, b) => a[1].localeCompare(b[1], "es")).forEach(([code, name]) => {
  $("country").add(new Option(`${flagEmoji(code)} ${name}`, code));
});

try {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved !== null) records = JSON.parse(saved);
} catch { records = []; }

function render() {
  const tbody = $("rankingBody");
  tbody.replaceChildren();

  if (records.length === 0) {
    tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#666;">Aún no hay clasificaciones</td></tr>`;
    return;
  }

  // Ordenar de MENOR a MAYOR (como en la imagen de Geohunter)
  const sorted = [...records].sort((a, b) => a.score - b.score);

  sorted.forEach((record, index) => {
    const tr = document.createElement("tr");
    
    // Columna del Ranking (Medallas para los primeros 3)
    const rankTd = document.createElement("td");
    rankTd.className = "rank";
    if (index === 0) rankTd.innerHTML = "🥇";
    else if (index === 1) rankTd.innerHTML = "🥈";
    else if (index === 2) rankTd.innerHTML = "🥉";
    else rankTd.textContent = `#${index + 1}`;
    
    // Columna del Jugador
    const playerTd = document.createElement("td");
    playerTd.className = "player";
    const img = document.createElement("img");
    img.src = `https://flagcdn.com/w40/${record.country.toLowerCase()}.png`;
    img.className = "flag";
    const nameSpan = document.createElement("span");
    nameSpan.textContent = record.name;
    playerTd.append(img, nameSpan);

    // Columna de Puntuación
    const scoreTd = document.createElement("td");
    scoreTd.className = "score";
    scoreTd.textContent = record.score;

    tr.append(rankTd, playerTd, scoreTd);
    tbody.append(tr);
  });
}

function switchTab(showRanking) {
  $("panelRanking").hidden = !showRanking;
  $("panelSubmit").hidden = showRanking;
  $("tabRanking").classList.toggle("active", showRanking);
  $("tabSubmit").classList.toggle("active", !showRanking);
}

$("tabRanking").onclick = () => switchTab(true);
$("tabSubmit").onclick = () => switchTab(false);

$("recordForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const game = $("gameName").value.trim();
  const name = $("playerName").value.trim();
  const country = $("country").value;
  const score = Number($("score").value);

  if (!game || !name || !country || score <= 0) return;

  records.push({ game, name, country, score, created: Date.now() });
  localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
  
  render();
  $("recordForm").reset();
  switchTab(true);
});

// Iniciar
render();
</script>

</body>
</html>
